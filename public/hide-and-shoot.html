        wallGrad.addColorStop(0, isHovered ? '#fbf1dc' : '#f1e6d2');
        wallGrad.addColorStop(.62, isHovered ? '#f3e3c7' : '#e6d7bd');
        wallGrad.addColorStop(1, '#d3c1a2');
        ctx.fillStyle = wallGrad;
        ctx.beginPath();
        ctx.roundRect(x, wallTop, w, wallH, Math.max(2, 4 * s));
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, wallTop, w, wallH, Math.max(2, 4 * s));
        ctx.clip();

        // Plaster grain.
        for (let i = 0; i < 34; i++) {
          const n1 = seededNoise(num * 13 + i * 1.7);
          const n2 = seededNoise(num * 29 + i * 2.3);
          ctx.fillStyle = n1 > .5 ? 'rgba(255, 250, 238, .45)' : 'rgba(146, 124, 92, .16)';
          ctx.beginPath();
          ctx.arc(x + n1 * w, wallTop + n2 * wallH, .7 + n2 * 1.5 * s, 0, Math.PI * 2);
          ctx.fill();
        }

        // Stone plinth along the bottom.
        const plinthH = Math.min(wallH * .17, h * .07);
        ctx.fillStyle = '#9c9186';
        ctx.fillRect(x, wallBot - plinthH, w, plinthH);
        ctx.fillStyle = 'rgba(255, 255, 255, .22)';
        for (let i = 0; i < 7; i++) {
          const bx = x + (w / 7) * i + 2;
          ctx.fillRect(bx, wallBot - plinthH + 1.5, w / 7 - 4, plinthH * .34);
        }

        // ---- Timber frame ----
        const beam = Math.max(3, w * .035);
        ctx.fillStyle = '#6b4a2b';
        ctx.fillRect(x, wallTop, w, beam * .9);                       // eaves beam
        ctx.fillRect(x, wallTop + wallH * .52, w, beam);              // mid rail
        [.16, .5, .84].forEach((f) => ctx.fillRect(x + w * f - beam / 2, wallTop, beam, wallH - plinthH));
        ctx.strokeStyle = '#6b4a2b';
        ctx.lineWidth = beam * .8;
        ctx.beginPath();
        ctx.moveTo(x + w * .16, wallTop + wallH * .52);
        ctx.lineTo(x + w * .5, wallTop + beam);
        ctx.moveTo(x + w * .84, wallTop + wallH * .52);
        ctx.lineTo(x + w * .5, wallTop + beam);
        ctx.stroke();

        // ---- Door ----
        const doorW = Math.min(w * .3, 54 * s);
        const doorH = Math.min(wallH * .56, 68 * s);
        const doorX = x + w * .5 - doorW / 2;
        const doorY = wallBot - plinthH - doorH;
        ctx.fillStyle = '#5d3d24';
        ctx.beginPath();
        ctx.moveTo(doorX, doorY + doorH);
        ctx.lineTo(doorX, doorY + doorW * .42);
        ctx.quadraticCurveTo(doorX + doorW * .5, doorY - doorW * .16, doorX + doorW, doorY + doorW * .42);
        ctx.lineTo(doorX + doorW, doorY + doorH);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 232, 198, .16)';
        ctx.fillRect(doorX + doorW * .12, doorY + doorW * .5, doorW * .3, doorH - doorW * .5);
        ctx.fillStyle = '#f0c85a';
        ctx.beginPath();
        ctx.arc(doorX + doorW * .78, doorY + doorH * .62, Math.max(1.4, 1.8 * s), 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(40, 24, 10, .5)';
        ctx.lineWidth = Math.max(1, 1.4 * s);
        ctx.beginPath();
        ctx.moveTo(doorX, doorY + doorH);
        ctx.lineTo(doorX, doorY + doorW * .42);
        ctx.quadraticCurveTo(doorX + doorW * .5, doorY - doorW * .16 + 1, doorX + doorW, doorY + doorW * .42);
        ctx.lineTo(doorX + doorW, doorY + doorH);
        ctx.stroke();

        // ---- Windows ----
        const winW = Math.min(w * .17, 32 * s);
        const winH = Math.min(wallH * .3, 34 * s);
        const winY = wallTop + wallH * .2;
        [.26, .74].forEach((f, wi) => {
          const wx = x + w * f - winW / 2;
          // Shutters
          ctx.fillStyle = wi === 0 ? '#3c6b5a' : '#3f5d78';
          ctx.fillRect(wx - winW * .34, winY, winW * .3, winH);
          ctx.fillRect(wx + winW + winW * .04, winY, winW * .3, winH);
          ctx.strokeStyle = 'rgba(20, 32, 26, .35)';
          ctx.lineWidth = 1;
          for (let k = 1; k < 3; k++) {
            ctx.beginPath();
            ctx.moveTo(wx - winW * .34, winY + (winH / 3) * k);
            ctx.lineTo(wx - winW * .04, winY + (winH / 3) * k);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(wx + winW * .04 + winW, winY + (winH / 3) * k);
            ctx.lineTo(wx + winW * .04 + winW * 1.3, winY + (winH / 3) * k);
            ctx.stroke();
          }
          // Frame + glass
          ctx.fillStyle = '#f7efdd';
          ctx.fillRect(wx - 2 * s, winY - 2 * s, winW + 4 * s, winH + 4 * s);
          const glass = ctx.createLinearGradient(wx, winY, wx + winW, winY + winH);
          if (isCracked && wi === 1) {
            glass.addColorStop(0, '#243c4f');
            glass.addColorStop(1, '#152632');
          } else {
            glass.addColorStop(0, 'rgba(255, 228, 160, .95)');
            glass.addColorStop(1, 'rgba(224, 168, 88, .9)');
          }
          ctx.fillStyle = glass;
          ctx.fillRect(wx, winY, winW, winH);
          ctx.strokeStyle = '#6b4a2b';
          ctx.lineWidth = Math.max(1.4, 2.2 * s);
          ctx.beginPath();
          ctx.moveTo(wx + winW / 2, winY);
          ctx.lineTo(wx + winW / 2, winY + winH);
          ctx.moveTo(wx, winY + winH / 2);
          ctx.lineTo(wx + winW, winY + winH / 2);
          ctx.stroke();
          if (isCracked && wi === 1) {
            // Blown-out pane.
            ctx.fillStyle = '#1b2b36';
            ctx.beginPath();
            ctx.moveTo(wx + winW * .18, winY + winH * .12);
            ctx.lineTo(wx + winW * .82, winY + winH * .38);
            ctx.lineTo(wx + winW * .44, winY + winH * .92);
            ctx.closePath();
            ctx.fill();
          }
        });

        // ---- House number, stencilled by the door ----
        const plateW = Math.min(w * .2, 30 * s);
        const plateH = Math.min(wallH * .19, 22 * s);
        ctx.fillStyle = 'rgba(247, 241, 227, .95)';
        ctx.beginPath();
        ctx.roundRect(x + w * .5 - plateW / 2, wallTop + wallH * .58, plateW, plateH, 2 * s);
        ctx.fill();
        ctx.strokeStyle = 'rgba(70, 46, 22, .45)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = '#2b1c0c';
        ctx.font = '700 ' + Math.max(10, Math.min(22, Math.floor(plateH * .8))) + 'px "Chakra Petch", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(num), x + w * .5, wallTop + wallH * .58 + plateH * .54);
        ctx.restore();

        // ---- Pitched roof ----
        const ridgeY = y + h * .02;
        const roofGrad = ctx.createLinearGradient(x, ridgeY, x + w, wallTop);
        roofGrad.addColorStop(0, isHovered ? '#b8543f' : '#a44a36');
        roofGrad.addColorStop(.55, '#8f3f2f');
        roofGrad.addColorStop(1, '#733227');
        // Side facet first, so the front gable overlaps it.
        ctx.fillStyle = '#5c2a21';
        ctx.beginPath();
        ctx.moveTo(x + w + ov, wallTop - dy * .2);
        ctx.lineTo(x + w * .5 + dx, ridgeY - dy);
        ctx.lineTo(x + w * .5, ridgeY);
        ctx.lineTo(x + w, wallTop);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = roofGrad;
        ctx.beginPath();
        ctx.moveTo(x - ov, wallTop);
        ctx.lineTo(x + w * .5, ridgeY);
        ctx.lineTo(x + w + ov, wallTop);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x - ov, wallTop);
        ctx.lineTo(x + w * .5, ridgeY);
        ctx.lineTo(x + w + ov, wallTop);
        ctx.closePath();
        ctx.clip();
        // Shingle courses.
        const courses = 4;
        for (let r = 0; r < courses; r++) {
          const t0 = r / courses, t1 = (r + 1) / courses;
          const yA = ridgeY + (wallTop - ridgeY) * t0;
          const yB = ridgeY + (wallTop - ridgeY) * t1;
          if (isCracked && r === 1) {
            ctx.fillStyle = 'rgba(38, 24, 16, .45)';
            ctx.fillRect(x, yA, w + ov * 2, yB - yA);
          }
          const count = 7 + r;
          for (let c = 0; c < count; c++) {
            const fx = x - ov + ((w + ov * 2) * (c + .5)) / count;
            const gap = (yB - yA) * .5;
            ctx.fillStyle = (r + c) % 2 ? 'rgba(255, 206, 178, .10)' : 'rgba(38, 16, 10, .14)';
            ctx.beginPath();
            ctx.roundRect(fx - (w / count) * .5 + 1, yA + gap * .2, (w / count) - 2, (yB - yA) * .78, 2);
            ctx.fill();
          }
          ctx.strokeStyle = 'rgba(40, 18, 10, .35)';
          ctx.lineWidth = Math.max(1, 1.3 * s);
          ctx.beginPath();
          ctx.moveTo(x - ov, yB);
          ctx.lineTo(x + w + ov, yB);
          ctx.stroke();
        }
        ctx.restore();

        // Ridge capping + eave shadow.
        ctx.strokeStyle = 'rgba(255, 214, 190, .45)';
        ctx.lineWidth = Math.max(1.4, 2.2 * s);
        ctx.beginPath();
        ctx.moveTo(x - ov, wallTop - 1);
        ctx.lineTo(x + w * .5, ridgeY + 1);
        ctx.lineTo(x + w + ov, wallTop - 1);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(30, 14, 8, .55)';
        ctx.lineWidth = Math.max(1.2, 2 * s);
        ctx.beginPath();
        ctx.moveTo(x - ov, wallTop);
        ctx.lineTo(x + w + ov, wallTop);
        ctx.stroke();

        // ---- Chimney with drifting smoke ----
        const chimW = Math.max(9, w * .11);
        const chimX = x + w * .74;
        const chimTop = ridgeY - h * .09;
        const chimBase = wallTop - roofH * .18;
        ctx.fillStyle = '#8d8177';
        ctx.fillRect(chimX, chimTop, chimW, chimBase - chimTop);
        ctx.fillStyle = '#a89c90';
        ctx.fillRect(chimX, chimTop, chimW, Math.max(3, 4 * s));
        ctx.fillStyle = 'rgba(60, 44, 30, .25)';
        for (let i = 0; i < 4; i++) {
          ctx.fillRect(chimX + 1, chimTop + (chimBase - chimTop) * (i / 4) + 2, chimW - 2, 1.4 * s);
        }
        const tNow = performance.now() / 1000;
        for (let i = 0; i < 3; i++) {
          const u = ((tNow * .34 + i / 3) % 1);
          const puffR = (2.6 + u * 9) * s;
          ctx.fillStyle = `rgba(236, 233, 227, ${(1 - u) * .3})`;
          ctx.beginPath();
          ctx.arc(chimX + chimW * .5 + Math.sin((tNow + i) * 1.3) * 5 * s, chimTop - u * h * .32, puffR, 0, Math.PI * 2);
          ctx.fill();
        }

        // ---- Damage and highlight ----
        if (isCracked) {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(x, wallTop, w, wallH, 4 * s);
          ctx.clip();
          ctx.fillStyle = 'rgba(28, 20, 14, .34)';
          ctx.beginPath();
          ctx.ellipse(x + w * .5, wallTop + wallH * .22, w * .3, wallH * .24, .2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(26, 16, 8, .7)';
          ctx.lineWidth = Math.max(1.4, 2.4 * s);
          ctx.beginPath();
          ctx.moveTo(x + w * .38, wallTop);
          ctx.lineTo(x + w * .5, wallTop + wallH * .3);
          ctx.lineTo(x + w * .42, wallTop + wallH * .58);
          ctx.lineTo(x + w * .6, wallBot);
          ctx.stroke();
          ctx.restore();
        }

        if (isHovered) {
          ctx.save();
          ctx.shadowColor = 'rgba(250, 204, 21, .85)';
          ctx.shadowBlur = 18 * s;
          ctx.strokeStyle = 'rgba(245, 158, 11, .95)';
          ctx.lineWidth = Math.max(2, 3 * s);
          ctx.beginPath();
          ctx.roundRect(x - 1, wallTop - 1, w + 2, wallH + 2, 4 * s);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x - ov, wallTop);
          ctx.lineTo(x + w * .5, ridgeY);
          ctx.lineTo(x + w + ov, wallTop);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawHouseRubble(x, y, w, h, dx, dy, groundY, s, num) {
        const baseY = groundY;
        const stumpH = h * .2;
        // Broken wall stumps.
        ctx.fillStyle = '#b9a98d';
        ctx.beginPath();
        ctx.moveTo(x + w * .04, baseY);
        ctx.lineTo(x + w * .04, baseY - stumpH * .9);
        ctx.lineTo(x + w * .2, baseY - stumpH * 1.28);
        ctx.lineTo(x + w * .34, baseY - stumpH * .7);
        ctx.lineTo(x + w * .3, baseY);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#a3927a';
        ctx.beginPath();
        ctx.moveTo(x + w * .62, baseY);
        ctx.lineTo(x + w * .68, baseY - stumpH * .62);
        ctx.lineTo(x + w * .94, baseY - stumpH * .98);
        ctx.lineTo(x + w * .96, baseY);
        ctx.closePath();
        ctx.fill();
        // Charred beams.
        ctx.strokeStyle = '#3b2b1c';
        ctx.lineWidth = Math.max(3, 5 * s);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x + w * .2, baseY - stumpH * .7);
        ctx.lineTo(x + w * .58, baseY - stumpH * .2);
        ctx.moveTo(x + w * .8, baseY - stumpH * .55);
        ctx.lineTo(x + w * .46, baseY - stumpH * .1);
        ctx.stroke();
        // Rubble pile.
        ctx.fillStyle = '#8f8069';
        for (let i = 0; i < 9; i++) {
          const n1 = seededNoise(num * 7 + i);
          const n2 = seededNoise(num * 17 + i * 3);
          const rx = x + w * (.12 + n1 * .76);
          const ry = baseY - n2 * stumpH * .32;
          ctx.beginPath();
          ctx.roundRect(rx, ry, (4 + n1 * 7) * s, (3 + n2 * 5) * s, 1.5);

          ctx.fill();
        }
        // Smoke still curling off the wreck.
        const tNow = performance.now() / 1000;
        for (let i = 0; i < 4; i++) {
          const u = ((tNow * .22 + i / 4) % 1);
          ctx.fillStyle = `rgba(92, 86, 80, ${(1 - u) * .22})`;
          ctx.beginPath();
          ctx.arc(x + w * (.3 + .4 * ((i * 37 % 10) / 10)) + Math.sin(tNow + i) * 6, baseY - stumpH - u * h * .5, (3 + u * 12) * s, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(20, 14, 8, .3)';
        ctx.beginPath();
        ctx.ellipse(x + w * .5, baseY + 2, w * .5, Math.max(4, h * .045), 0, 0, Math.PI * 2);
        ctx.fill();
      }
      function renderFrame(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;
        const fxDt = dt * (now < cinematicUntil ? 0.42 : 1);

        // Smooth, slow backward cover shift
        const shiftDiff = state.targetCoverShift - state.coverShiftProgress;
        if (Math.abs(shiftDiff) > 0.001) {
          state.coverShiftProgress += shiftDiff * Math.min(1, dt * 2.6);
        } else {
          state.coverShiftProgress = state.targetCoverShift;
        }

        // Reaction clock for the hider, plus the bomber's aim and wind-up.
        state.moodT += dt;
        computeBlockHitboxes();
        updateBomber(dt);
        ctx.clearRect(0, 0, stageW, stageH);

        drawBackdrop(dt);

        // The hider drops behind his crate and is then genuinely gone: he is only
        // painted during the tuck-in, shrinking and fading as he sinks out of
        // sight, so nothing of him shows beside or above the cover afterwards.
        const liveHider = state.hiddenBlock != null ? blockHitboxes[state.hiddenBlock - 1] : null;
        blockHitboxes.forEach((box) => {
          if (liveHider === box && state.hiderMood === 'hide' && state.phase === 'TUCKING') {
            const s = box.scale || 1;
            const tuck = Math.max(0, Math.min(1, state.moodT / 0.6));
            ctx.save();
            ctx.globalAlpha = 1 - tuck * 0.98;
            drawHiderCharacter(
              box.x + box.w / 2,
              box.groundY + 2 * s + box.h * 0.30 * tuck,
              box.h * (1.02 - 0.26 * tuck),
              'hide',
              state.moodT,
              state.hiderId,
              true
            );
            ctx.restore();
          }
          drawHouse(box);
        });

        // Exposed hider (caught, survived, dancing) then the shooter in front.
        drawHiderForeground();
        updateBombs(dt);
        drawBombs(dt);
        drawBlasts();
        drawBlastRings(dt);
        drawDebris(dt);
        drawBomber();

        // Flying stone slabs
        for (let i = slabs.length - 1; i >= 0; i--) {
          const s = slabs[i];
          s.x += s.vx * fxDt;
          s.y += s.vy * fxDt;
          s.vy += 460 * fxDt;
          s.rot += s.vRot * fxDt;

          if (s.y >= s.floorY) {
            s.y = s.floorY;
            if (!s.bounced) {
              s.bounced = true;
              s.vy = -Math.abs(s.vy) * 0.32;
              s.vx *= 0.65;
              s.vRot *= 0.55;
            } else {
              s.vy = 0;
              s.vx *= 0.8;
              s.vRot = 0;
            }
          }

          s.life -= s.decay * fxDt;
          if (s.life <= 0) {
            slabs.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 1.25));
          ctx.translate(s.x, s.y);
          ctx.rotate(s.rot);
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.roundRect(-s.w / 2, -s.h / 2, s.w, s.h, 3);
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#44403c';
          ctx.stroke();
          ctx.restore();
        }

        // Dust clouds
        for (let i = dustPuffs.length - 1; i >= 0; i--) {
          const d = dustPuffs[i];
          d.x += d.vx * fxDt;
          d.y += d.vy * fxDt;
          d.vx *= 0.96;
          d.vy *= 0.96;
          d.radius += d.growth * fxDt;
          d.alpha -= d.decay * fxDt;

          if (d.alpha <= 0) {
            dustPuffs.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, d.alpha * 0.62);
          ctx.fillStyle = '#efe1c6';
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Ejected brass and muzzle smoke.
        for (let i = shells.length - 1; i >= 0; i--) {
          const sh = shells[i];
          sh.vy += 640 * fxDt;
          sh.x += sh.vx * fxDt;
          sh.y += sh.vy * fxDt;
          sh.rot += sh.vRot * fxDt;
          if (sh.y > sh.floorY) {
            sh.y = sh.floorY;
            if (!sh.bounced) {
              sh.bounced = true;
              sh.vy *= -.38;
              sh.vx *= .55;
              sh.vRot *= .5;
            } else {
              sh.vy = 0;
              sh.vx = 0;
              sh.vRot = 0;
            }
          }
          if (sh.bounced) {
            sh.life -= fxDt * .42;
            if (sh.life <= 0) { shells.splice(i, 1); continue; }
          }
          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, sh.life));
          ctx.translate(sh.x, sh.y);
          ctx.rotate(sh.rot);
          ctx.fillStyle = '#c99532';
          ctx.fillRect(-sh.size, -sh.size * .5, sh.size * 2, sh.size);
          ctx.fillStyle = '#f7dc93';
          ctx.fillRect(-sh.size, -sh.size * .5, sh.size * 2, sh.size * .38);
          ctx.restore();
        }
        for (let i = smokePuffs.length - 1; i >= 0; i--) {
          const p = smokePuffs[i];
          p.x += p.vx * fxDt;
          p.y += p.vy * fxDt;
          p.vx *= .98;
          p.vy -= 14 * fxDt;
          p.r += p.grow * fxDt;
          p.life -= fxDt * .85;
          if (p.life <= 0) { smokePuffs.splice(i, 1); continue; }
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life) * .24;
          ctx.fillStyle = p.tint || '#e9eef5';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Sparks        // Sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
          const sp = sparks[i];
          sp.x += sp.vx * fxDt;
          sp.y += sp.vy * fxDt;
          sp.vy += 320 * fxDt;
          sp.life -= sp.decay * fxDt;

          if (sp.life <= 0) {
            sparks.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, sp.life);
          ctx.fillStyle = sp.color;
          ctx.fillRect(sp.x - sp.size / 2, sp.y - sp.size / 2, sp.size, sp.size);
          ctx.restore();
        }

        // Win celebration confetti
        for (let i = confetti.length - 1; i >= 0; i--) {
          const c = confetti[i];
          c.x += c.vx * dt;
          c.y += c.vy * dt;
          c.vy += 240 * dt;
          c.vx *= 0.99;
          c.rot += c.vRot * dt;
          c.life -= c.decay * dt;

          if (c.life <= 0) {
            confetti.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, c.life);
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
          ctx.restore();
        }

        // Blast light washing over the whole courtyard.
        if (blastFlash > 0.001) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = `rgba(255, 226, 176, ${Math.min(.5, blastFlash * .42)})`;
          ctx.fillRect(0, 0, stageW, stageH);
          ctx.restore();
          blastFlash = Math.max(0, blastFlash - dt * 2.6);
        }

        const stillAnimating =
          state.phase === 'TUCKING' ||
          state.phase === 'SHOOT' ||
          state.phase === 'ANIMATING' ||
          state.hiderMood !== 'hide' ||
          BOMBER.alpha > 0.01 ||
          BOMBER.wind > 0.001 ||
          Math.abs(state.targetCoverShift - state.coverShiftProgress) > 0.001 ||
          bombs.length > 0 ||
          blasts.length > 0 ||
          blastRings.length > 0 ||
          debris.length > 0 ||
          blastFlash > 0.001 ||
          shells.length > 0 ||
          smokePuffs.length > 0 ||
          slabs.length > 0 ||
          dustPuffs.length > 0 ||
          sparks.length > 0 ||
          confetti.length > 0 ||
          dustMotes.length > 0;

        if (stillAnimating) {
          animLoopId = requestAnimationFrame(renderFrame);
        } else {
          animLoopId = null;
        }
      }

      function ensureRenderLoop() {
        if (!animLoopId) {
          lastTime = performance.now();
          animLoopId = requestAnimationFrame(renderFrame);
        }
      }

      function getCanvasCoords(clientX, clientY) {
        const rect = els.arenaCanvas.getBoundingClientRect();
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function hitTestBlock(x, y) {
        for (let i = 0; i < blockHitboxes.length; i++) {
          const b = blockHitboxes[i];
          if (x >= b.x - 6 && x <= b.x + b.w + 6 && y >= b.y - 12 && y <= b.groundY + 8) {
            return b.num;
          }
        }
        return null;
      }

      // =========================================================================
      // 5. TOAST HELPER
      // =========================================================================
      function showToast(msg, tone = 'info') {
        const item = document.createElement('div');
        const styles = {
          info: 'bg-amber-50/95 border-amber-700/40 text-slate-900',
          miss: 'bg-rose-50/95 border-rose-500/60 text-rose-950',
          win: 'bg-emerald-50/95 border-emerald-600/60 text-emerald-950'
        };
        item.className = `px-3.5 py-1.5 rounded-xl border text-xs font-bold shadow-lg backdrop-blur-md animate-pop-in ${styles[tone] || styles.info}`;
        item.textContent = msg;
        els.toastContainer.appendChild(item);

        setTimeout(() => {
          item.style.opacity = '0';
          item.style.transform = 'translateY(-6px)';
          item.style.transition = 'opacity 200ms ease, transform 200ms ease';
          setTimeout(() => item.remove(), 220);
        }, 1600);
      }

      // =========================================================================
      // 6. GAME LOOP & ROUND LOGIC
      // =========================================================================
      function getPlayerName(id) {
        return state.players[id]?.name?.trim() || `Player ${id}`;
      }

      function onBlockSelect(blockNum) {
        if (state.phase !== 'HIDE') return;
        audio.playCoverShift();
        state.hiddenBlock = blockNum;
        state.foundCharacter = false;
        state.targetCoverShift = 1;
        state.hoveredBlock = null;
        state.phase = 'TUCKING';
        state.hiderMood = 'hide';
        state.moodT = 0;
        state.aimBlock = null;
        state.crackedBlocks.clear();
        state.shatteredBlocks.clear();
        ensureRenderLoop();
        renderAll();

        // Smooth, unhurried tuck-in into the selected block before pass-the-screen handoff
        setTimeout(() => {
          if (state.phase === 'TUCKING') {
            state.phase = 'HANDOFF';
            renderAll();
          }
        }, 1250);
      }

      function startShooting() {
        if (state.phase !== 'HANDOFF') return;
        audio.playClick();
        audio.playGunCock();
        state.phase = 'SHOOT';
        state.aimBlock = 2;
        BOMBER.ready = false;
        BOMBER.alpha = Math.max(BOMBER.alpha, .35);
        BOMBER.hasBomb = true;
        ensureRenderLoop();
        renderAll();
      }

      function onFireBlock(blockNum) {
        if (state.phase !== 'SHOOT' || state.chancesLeft <= 0) return;

        if (state.shatteredBlocks.has(blockNum)) {
          showToast(`House ${blockNum} is already rubble`, 'miss');
          return;
        }
        if (state.crackedBlocks.has(blockNum)) {
          showToast(`House ${blockNum} is already hit`, 'miss');
          return;
        }

        state.phase = 'ANIMATING';
        state.chancesLeft -= 1;
        state.aimBlock = blockNum;
        computeBlockHitboxes();

        // Snap the throwing arm onto the chosen house and start the wind-up.
        const aimBox = blockHitboxes[blockNum - 1];
        if (aimBox) {
          BOMBER.aimX = aimBox.x + aimBox.w * .5;
          BOMBER.aimY = aimBox.y + aimBox.h * .34;
        }
        BOMBER.ready = true;
        BOMBER.throwing = true;
        BOMBER.throwT = 0;
        BOMBER.hasBomb = true;
        audio.playGunCock();
        updateBomber(.016);
        ensureRenderLoop();
        renderAll();

        const isHit = blockNum === state.hiddenBlock;

        throwBombToBlock(blockNum, (ix, iy) => {
          const box = blockHitboxes[blockNum - 1];

          if (isHit) {
            state.shatteredBlocks.add(blockNum);
            state.foundCharacter = true; // he is blasted out of cover
            state.hiderMood = 'shock';
            state.moodT = 0;
            if (box) spawnStoneBreakage(box, true);
            BOMBER.hasBomb = false;
            const willWinMatch = state.players[state.shooterId].score + 1 >= TARGET_WINS;
            triggerWinCelebration(ix, iy, willWinMatch);
            ensureRenderLoop();

            // He is exposed, freezes, then breaks down crying.
            setTimeout(() => {
              if (state.phase === 'ANIMATING') {
                state.hiderMood = 'cry';
                state.moodT = 0;
                audio.playCry();
                showToast(`CAUGHT! He was hiding behind house ${blockNum}`, 'miss');
              }
            }, 520);
            setTimeout(() => {
              concludeRound({ winnerId: state.shooterId });
            }, 2750);
          } else {
            state.crackedBlocks.add(blockNum);
            if (box) spawnStoneBreakage(box, false);
            ensureRenderLoop();

            if (state.chancesLeft > 0) {
              setTimeout(() => {
                if (state.phase === 'ANIMATING') {
                  showToast(`Miss — house ${blockNum} is empty`, 'miss');
                  state.phase = 'SHOOT';
                  BOMBER.hasBomb = true;
                  BOMBER.throwing = false;
                  BOMBER.wind = 0;
                  ensureRenderLoop();
                  renderAll();
                }
              }, 900);
            } else {
              // Out of bombs: he survived the turn. He steps out, then dances.
              state.hiderMood = 'peek';
              state.moodT = 0;
              ensureRenderLoop();
              setTimeout(() => {
                if (state.phase === 'ANIMATING') {
                  state.hiderMood = 'dance';
                  state.moodT = 0;
                  audio.playCheer();
                  const hb = blockHitboxes[state.hiddenBlock - 1];
                  triggerWinCelebration(hb ? hb.x + hb.w / 2 : stageW / 2, stageH * .48, false);
                  showToast(`${getPlayerName(state.hiderId)} was never hit — he survives!`, 'win');
                }
              }, 620);
              setTimeout(() => {
                concludeRound({ winnerId: state.hiderId });
              }, 3150);
            }
          }
        });
      }
      function concludeRound(outcome) {
        state.lastRoundOutcome = outcome;
        state.players[outcome.winnerId].score += 1;

        // The reaction stays on screen under the result card: crying when caught,
        // still dancing when the hider beat the shot.
        state.hiderMood = outcome.winnerId === state.shooterId ? 'cry' : 'dance';
        if (state.hiderMood === 'cry' && state.moodT < .3) state.moodT = .6;

        const isChampion = state.players[outcome.winnerId].score >= TARGET_WINS;
        if (isChampion) {
          state.matchWinnerId = outcome.winnerId;
          triggerWinCelebration(stageW * 0.5, stageH * 0.45, true);
        }

        audio.playWinFanfare();
        state.phase = 'ROUND_END';
        ensureRenderLoop();
        renderAll();
      }

      function nextRound() {
        audio.playClick();
        state.round += 1;
        state.hiderId = state.round % 2 === 1 ? 1 : 2;
        state.shooterId = state.hiderId === 1 ? 2 : 1;

        state.phase = 'HIDE';
        state.hiddenBlock = null;
        state.foundCharacter = false;
        state.hidePeekProgress = 0;
        state.hiderMood = 'hide';
        state.moodT = 0;
        state.aimBlock = null;
        BOMBER.ready = false;
        BOMBER.throwing = false;
        BOMBER.wind = 0;
        BOMBER.throwT = 0;
        BOMBER.hasBomb = true;
        shells = [];
        smokePuffs = [];
        state.targetCoverShift = 0;
        state.hoveredBlock = null;
        state.crackedBlocks.clear();
        state.shatteredBlocks.clear();
        state.chancesLeft = MAX_CHANCES;
        state.lastRoundOutcome = null;
        state.matchWinnerId = null;

        ensureRenderLoop();
        renderAll();
      }

      function resetMatch() {
        audio.playClick();
        state.players[1].score = 0;
        state.players[2].score = 0;
        state.round = 0;
        nextRound();
      }

      // =========================================================================
      // 7. UI RENDERING
      // =========================================================================
      function renderAll() {
        const p1Name = getPlayerName(1);
        const p2Name = getPlayerName(2);
        const hiderName = getPlayerName(state.hiderId);
        const shooterName = getPlayerName(state.shooterId);

        els.roundBadge.textContent = `R${state.round}`;
        els.targetWinsDisplay.textContent = String(TARGET_WINS);
        els.p1Score.textContent = String(state.players[1].score);
        els.p2Score.textContent = String(state.players[2].score);

        els.p1RoleTag.textContent = state.hiderId === 1 ? 'HIDE' : 'SHOOT';
        els.p1RoleTag.className = `text-[9px] font-display font-bold uppercase tracking-wider px-1.5 py-0.2 rounded inline-block ${
          state.hiderId === 1 ? 'bg-sky-100 text-sky-900' : 'bg-amber-200 text-amber-950'
        }`;

        els.p2RoleTag.textContent = state.hiderId === 2 ? 'HIDE' : 'SHOOT';
        els.p2RoleTag.className = `text-[9px] font-display font-bold uppercase tracking-wider px-1.5 py-0.2 rounded inline-block ${
          state.hiderId === 2 ? 'bg-sky-100 text-sky-900' : 'bg-amber-200 text-amber-950'
        }`;

        const activeId = state.phase === 'HIDE' || state.phase === 'TUCKING' ? state.hiderId : state.shooterId;
        els.p1Card.classList.toggle('border-amber-600', activeId === 1);
        els.p1Card.classList.toggle('border-amber-900/15', activeId !== 1);
        els.p2Card.classList.toggle('border-amber-600', activeId === 2);
        els.p2Card.classList.toggle('border-amber-900/15', activeId !== 2);

        els.chancesText.textContent = String(state.chancesLeft);
        els.chanceDot1.className = `w-4 h-2 rounded-full transition-all ${
          state.chancesLeft >= 1 ? 'bg-amber-500' : 'bg-amber-950/15'
        }`;
        els.chanceDot2.className = `w-4 h-2 rounded-full transition-all ${
          state.chancesLeft >= 2 ? 'bg-amber-500' : 'bg-amber-950/15'
        }`;

        if (state.phase === 'HIDE' || state.phase === 'TUCKING') {
          els.phasePill.textContent = 'HIDE';
          els.phasePill.className = 'px-2 py-0.5 rounded-md text-[10px] font-display font-bold tracking-wider uppercase bg-sky-600 text-white shrink-0';
          els.statusPrompt.textContent = `${hiderName}: Pick a House 1–4`;
        } else if (state.phase === 'HANDOFF') {
          els.phasePill.textContent = 'COVER';
          els.phasePill.className = 'px-2 py-0.5 rounded-md text-[10px] font-display font-bold tracking-wider uppercase bg-amber-600 text-white shrink-0';
          els.statusPrompt.textContent = `${shooterName}: Ready`;
        } else if (state.phase === 'SHOOT') {
          els.phasePill.textContent = 'SHOOT';
          els.phasePill.className = 'px-2 py-0.5 rounded-md text-[10px] font-display font-bold tracking-wider uppercase bg-orange-600 text-white shrink-0';
          els.statusPrompt.textContent = `${shooterName}: Throw at 1–4`;
        } else if (state.phase === 'ANIMATING') {
          els.phasePill.textContent = 'FIRE';
          els.phasePill.className = 'px-2 py-0.5 rounded-md text-[10px] font-display font-bold tracking-wider uppercase bg-rose-600 text-white shrink-0';
          els.statusPrompt.textContent = shooterName;
        } else if (state.phase === 'ROUND_END') {
          els.phasePill.textContent = 'WIN';
          els.phasePill.className = 'px-2 py-0.5 rounded-md text-[10px] font-display font-bold tracking-wider uppercase bg-emerald-600 text-white shrink-0';
          els.statusPrompt.textContent = `${getPlayerName(state.lastRoundOutcome.winnerId)} Wins`;
        }

        const canShoot = state.phase === 'SHOOT' && state.chancesLeft > 0;
        els.shotButtons.forEach((btn, idx) => {
          const bNum = idx + 1;
          const isCracked = state.crackedBlocks.has(bNum);
          const isShattered = state.shatteredBlocks.has(bNum);
          btn.disabled = !canShoot || isCracked || isShattered;
          btn.classList.toggle('shot-missed', isCracked);
          btn.classList.toggle('shot-hit', isShattered);
        });

        els.handoffOverlay.classList.toggle('hidden', state.phase !== 'HANDOFF');
        if (state.phase === 'HANDOFF') {
          els.handoffTitle.textContent = `${shooterName}'s Turn`;
        }

        const showRoundEnd = state.phase === 'ROUND_END' && state.lastRoundOutcome;
        els.roundResultOverlay.classList.toggle('hidden', !showRoundEnd);
        if (showRoundEnd) {
          const { winnerId } = state.lastRoundOutcome;
          const winnerName = getPlayerName(winnerId);
          const matchOver = state.matchWinnerId !== null;

          const winCard = document.getElementById('win-card');
          winCard.classList.toggle('champion-card-glow', matchOver);

          els.roundOutcomeBadge.textContent = matchOver ? `3 WINS • CHAMPION` : 'ROUND WIN';
          els.roundWinnerHeading.textContent = matchOver ? `${winnerName} Champion!` : `${winnerName} Wins!`;
          els.btnNextRound.classList.toggle('hidden', matchOver);
          els.btnRematch.classList.toggle('hidden', !matchOver);

          els.summaryP1Label.textContent = p1Name;
          els.summaryP2Label.textContent = p2Name;
          els.summaryP1Score.textContent = String(state.players[1].score);
          els.summaryP2Score.textContent = String(state.players[2].score);
        }
      }

      // =========================================================================
      // 8. EVENTS
      // =========================================================================
      function toggleFullscreen() {
        const el = document.documentElement;
        const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        try {
          if (!isFs) {
            const req = el.requestFullscreen || el.webkitRequestFullscreen;
            if (!req) return;
            const p = req.call(el, { navigationUI: 'hide' });
            if (p && p.catch) p.catch(() => {});
          } else {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) exit.call(document);
          }
        } catch (e) { /* full screen unavailable */ }
      }

      function syncSoundButton() {
        const on = !audio.muted;
        const iOn = document.getElementById('icon-sound-on');
        const iOff = document.getElementById('icon-sound-off');
        if (iOn) iOn.classList.toggle('hidden', !on);
        if (iOff) iOff.classList.toggle('hidden', on);
        const btn = document.getElementById('btn-sound');
        if (btn) btn.setAttribute('aria-pressed', String(on));
      }

      function bindEvents() {
        els.p1NameInput.addEventListener('input', (e) => {
          state.players[1].name = e.target.value;
          renderAll();
        });
        els.p1NameInput.addEventListener('blur', () => {
          if (!state.players[1].name.trim()) {
            state.players[1].name = 'Player 1';
            els.p1NameInput.value = 'Player 1';
          }
          renderAll();
        });

        els.p2NameInput.addEventListener('input', (e) => {
          state.players[2].name = e.target.value;
          renderAll();
        });
        els.p2NameInput.addEventListener('blur', () => {
          if (!state.players[2].name.trim()) {
            state.players[2].name = 'Player 2';
            els.p2NameInput.value = 'Player 2';
          }
          renderAll();
        });

        els.arenaCanvas.addEventListener('mousemove', (e) => {
          if (state.phase !== 'HIDE') {
            if (state.hoveredBlock !== null) {
              state.hoveredBlock = null;
              ensureRenderLoop();
            }
            return;
          }
          const pt = getCanvasCoords(e.clientX, e.clientY);
          const hit = hitTestBlock(pt.x, pt.y);
          if (hit !== state.hoveredBlock) {
            state.hoveredBlock = hit;
            ensureRenderLoop();
          }
        });

        els.arenaCanvas.addEventListener('mouseleave', () => {
          if (state.hoveredBlock !== null) {
            state.hoveredBlock = null;
            ensureRenderLoop();
          }
        });

        els.arenaCanvas.addEventListener('click', (e) => {
          if (state.phase !== 'HIDE') return;
          const pt = getCanvasCoords(e.clientX, e.clientY);
          const hit = hitTestBlock(pt.x, pt.y);
          if (hit) onBlockSelect(hit);
        });

        els.shotButtons.forEach((btn, idx) => {
          btn.addEventListener('click', () => onFireBlock(idx + 1));
          // Hovering a shot button swings the rifle onto that block before firing.
          const aim = () => {
            if (state.phase !== 'SHOOT') return;
            state.aimBlock = idx + 1;
            ensureRenderLoop();
          };
          btn.addEventListener('mouseenter', aim);
          btn.addEventListener('focus', aim);
        });

        els.btnStartShooting.addEventListener('click', startShooting);
        els.btnNextRound.addEventListener('click', nextRound);
        els.btnRematch.addEventListener('click', resetMatch);
        els.btnResetMatch.addEventListener('click', resetMatch);

        const fsBtn = document.getElementById('btn-fullscreen');
        if (fsBtn) fsBtn.addEventListener('click', () => { audio.unlock(); toggleFullscreen(); });
        const sndBtn = document.getElementById('btn-sound');
        if (sndBtn) sndBtn.addEventListener('click', () => { audio.unlock(); audio.toggleMute(); syncSoundButton(); });
        syncSoundButton();
        ['pointerdown', 'keydown', 'touchstart'].forEach((evt) => {
          window.addEventListener(evt, () => audio.unlock(), { once: true, passive: true });
        });


        window.addEventListener('keydown', (e) => {
          const tag = document.activeElement?.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;

          if (state.phase === 'SHOOT' && ['1', '2', '3', '4'].includes(e.key)) {
            onFireBlock(Number(e.key));
          }
          if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        });

        window.addEventListener('resize', resizeCanvas);
        document.addEventListener('fullscreenchange', () => setTimeout(resizeCanvas, 60));
        document.addEventListener('webkitfullscreenchange', () => setTimeout(resizeCanvas, 60));
      }

      window.addEventListener('DOMContentLoaded', () => {
        bindEvents();
        resizeCanvas();
        renderAll();
      });
    })();
  </script>
</body>
</html>
