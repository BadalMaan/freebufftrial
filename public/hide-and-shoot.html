<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hide and Shoot — Global Punjabi Classes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #dbeafe 0%, #e2e8f0 58%, #cbd5e1 100%);
      color: #0f172a;
      overflow-x: hidden;
    }

    .font-display {
      font-family: 'Chakra Petch', sans-serif;
    }

    @keyframes screen-quake {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      14% { transform: translate3d(-10px, 5px, 0) rotate(-0.6deg); }
      28% { transform: translate3d(10px, -6px, 0) rotate(0.6deg); }
      42% { transform: translate3d(-8px, -4px, 0) rotate(-0.4deg); }
      56% { transform: translate3d(7px, 4px, 0) rotate(0.35deg); }
      70% { transform: translate3d(-4px, 2px, 0) rotate(-0.2deg); }
      85% { transform: translate3d(2px, -1px, 0) rotate(0.1deg); }
    }

    .arena-quake {
      animation: screen-quake 460ms cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes win-flash {
      0% { opacity: 0.72; }
      100% { opacity: 0; }
    }

    .win-flash-overlay {
      animation: win-flash 950ms ease-out forwards;
    }

    @keyframes champion-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 22px 45px rgba(217, 119, 6, 0.28); }
      50% { transform: scale(1.025); box-shadow: 0 28px 60px rgba(245, 158, 11, 0.45); }
    }

    .champion-card-glow {
      animation: champion-pulse 1.8s ease-in-out infinite;
    }

    /* Compact Bottom 1 2 3 4 Shoot Triggers */
    .shot-trigger {
      background: linear-gradient(180deg, #ffffff 0%, #fde68a 100%);
      border: 2px solid #92400e;
      box-shadow:
        0 4px 0 #78350f,
        0 8px 14px rgba(120, 53, 15, 0.22),
        inset 0 2px 0 rgba(255, 255, 255, 0.9);
      transition: transform 120ms ease, box-shadow 140ms ease, border-color 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    .shot-trigger:not(:disabled):hover {
      transform: translateY(-2px);
      border-color: #d97706;
      background: linear-gradient(180deg, #ffffff 0%, #fcd34d 100%);
      box-shadow:
        0 6px 0 #78350f,
        0 12px 18px rgba(120, 53, 15, 0.28),
        0 0 14px rgba(245, 158, 11, 0.4);
    }

    .shot-trigger:not(:disabled):active {
      transform: translateY(2px);
      box-shadow:
        0 2px 0 #78350f,
        0 4px 8px rgba(120, 53, 15, 0.2);
    }

    .shot-trigger:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .shot-trigger.shot-missed {
      border-color: #e11d48;
      background: linear-gradient(180deg, #ffe4e6 0%, #fecdd3 100%);
      box-shadow: 0 3px 0 #9f1239;
    }

    .shot-trigger.shot-hit {
      border-color: #059669;
      background: linear-gradient(180deg, #d1fae5 0%, #a7f3d0 100%);
      box-shadow: 0 3px 0 #065f46;
    }

    @keyframes pop-in {
      0% { opacity: 0; transform: scale(0.92) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .animate-pop-in {
      animation: pop-in 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* PREMIUM COOL-STONE SKIN */
    body {
      background: radial-gradient(ellipse at 50% -15%, #dbeafe 0%, #e7eef7 42%, #cbd5e1 100%);
      color: #172033;
    }
    header {
      background: rgba(241, 247, 255, .94) !important;
      border-color: rgba(51, 65, 85, .18) !important;
      box-shadow: 0 8px 28px rgba(15, 23, 42, .10) !important;
    }
    #arena-stage {
      border: 2px solid rgba(148, 163, 184, .72) !important;
      border-radius: 22px !important;
      box-shadow: 0 22px 55px rgba(15, 23, 42, .20), inset 0 1px 0 rgba(255,255,255,.8) !important;
      background: #dbeafe !important;
    }
    #p1-card, #p2-card, #phase-pill, #status-prompt,
    main > section:not(#arena-stage) {
      filter: saturate(.88);
    }
    .shot-trigger {
      background: linear-gradient(180deg, #ffffff 0%, #dbeafe 100%) !important;
      border: 1px solid #64748b !important;
      border-radius: 13px !important;
      box-shadow: 0 4px 0 #475569, 0 9px 18px rgba(15,23,42,.16), inset 0 1px 0 #fff !important;
      transition: transform 220ms cubic-bezier(.2,.8,.2,1), box-shadow 220ms ease, filter 220ms ease !important;
    }
    .shot-trigger:not(:disabled):hover {
      background: linear-gradient(180deg, #fff 0%, #bfdbfe 100%) !important;
      border-color: #2563eb !important;
      box-shadow: 0 5px 0 #334155, 0 12px 24px rgba(37,99,235,.20) !important;
    }
    .shot-trigger:not(:disabled):active { transform: translateY(2px) scale(.985) !important; }
    button { -webkit-font-smoothing: antialiased; }
    #btn-start-shooting, #btn-next-round, #btn-rematch {
      filter: saturate(.82);
      letter-spacing: .06em;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

  </style>
</head>
<body class="h-dvh max-h-dvh flex flex-col justify-between overflow-hidden">
  <!-- Toast Banner -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none px-4 w-full max-w-sm flex flex-col items-center gap-1.5"></div>

  <!-- Top HUD & Editable Player Cards -->
  <header class="relative z-30 w-full bg-amber-50/90 backdrop-blur-md border-b border-amber-900/20 shadow-sm shrink-0">
    <div class="max-w-5xl mx-auto px-3 sm:px-5 py-2 flex flex-col gap-1.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center shadow shrink-0">
            <svg class="w-4 h-4 text-slate-950" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="8"></circle>
              <line x1="12" y1="2" x2="12" y2="6"></line>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="6" y2="12"></line>
              <line x1="18" y1="12" x2="22" y2="12"></line>
            </svg>
          </div>
          <h1 class="font-display text-sm sm:text-lg font-bold tracking-wide text-slate-900 truncate">
            STONE COVER &amp; SHOT
          </h1>
          <span id="round-badge" class="px-2 py-0.5 rounded-full text-[10px] font-display font-bold bg-amber-200/80 text-amber-950 border border-amber-800/20">
            R1
          </span>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button
            id="btn-reset-match"
            type="button"
            class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-rose-600 hover:bg-rose-500 text-white shadow transition"
          >
            Reset
          </button>
        </div>
      </div>

      <!-- Editable Player Cards -->
      <div class="grid grid-cols-2 gap-2 sm:gap-3">
        <div id="p1-card" class="rounded-xl bg-white/90 border-2 border-amber-900/15 px-2.5 py-1.5 flex items-center justify-between gap-2 transition-all">
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-600 shrink-0"></span>
            <div class="min-w-0 flex-1">
              <span id="p1-role-tag" class="text-[9px] font-display font-bold uppercase tracking-wider px-1.5 py-0.2 rounded inline-block"></span>
              <div class="flex items-center gap-1">
                <input
                  id="p1-name-input"
                  type="text"
                  maxlength="16"
                  value="Player 1"
                  aria-label="Edit Player 1 Name"
                  class="w-full bg-transparent text-xs sm:text-sm font-bold text-slate-900 focus:outline-none focus:bg-amber-100 focus:px-1 rounded"
                />
                <svg class="w-3 h-3 text-slate-400 shrink-0 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
              </div>
            </div>
          </div>
          <div class="text-right pl-2 border-l border-amber-900/15 shrink-0">
            <div id="p1-score" class="font-display text-base sm:text-lg font-bold text-amber-800 leading-none">0</div>
          </div>
        </div>

        <div id="p2-card" class="rounded-xl bg-white/90 border-2 border-amber-900/15 px-2.5 py-1.5 flex items-center justify-between gap-2 transition-all">
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-600 shrink-0"></span>
            <div class="min-w-0 flex-1">
              <span id="p2-role-tag" class="text-[9px] font-display font-bold uppercase tracking-wider px-1.5 py-0.2 rounded inline-block"></span>
              <div class="flex items-center gap-1">
                <input
                  id="p2-name-input"
                  type="text"
                  maxlength="16"
                  value="Player 2"
                  aria-label="Edit Player 2 Name"
                  class="w-full bg-transparent text-xs sm:text-sm font-bold text-slate-900 focus:outline-none focus:bg-amber-100 focus:px-1 rounded"
                />
                <svg class="w-3 h-3 text-slate-400 shrink-0 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
              </div>
            </div>
          </div>
          <div class="text-right pl-2 border-l border-amber-900/15 shrink-0">
            <div id="p2-score" class="font-display text-base sm:text-lg font-bold text-amber-800 leading-none">0</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Single-Screen Limestone Terrace Arena -->
  <main class="relative z-10 flex-1 min-h-0 flex flex-col justify-between w-full px-2.5 sm:px-5 pt-2 pb-2.5 gap-2">
    <!-- Compact Status & Shots Strip -->
    <section class="relative z-20 max-w-5xl w-full mx-auto flex items-center justify-between gap-2 rounded-xl bg-white/85 border border-amber-900/15 backdrop-blur-md px-3 py-1.5 shadow-sm shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <span id="phase-pill" class="px-2 py-0.5 rounded-md text-[10px] font-display font-bold tracking-wider uppercase bg-sky-600 text-white shrink-0">
          HIDE
        </span>
        <span id="status-prompt" class="text-xs sm:text-sm font-bold text-slate-900 truncate">
          Player 1: Pick a block
        </span>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <span id="chance-dot-1" class="w-4 h-2 rounded-full bg-amber-500 transition-all"></span>
        <span id="chance-dot-2" class="w-4 h-2 rounded-full bg-amber-500 transition-all"></span>
        <span id="chances-text" class="font-display text-xs font-bold text-amber-900 ml-0.5">2</span>
      </div>
    </section>

    <!-- Arena Stage -->
    <section
      id="arena-stage"
      class="relative flex-1 min-h-0 max-w-5xl w-full mx-auto rounded-2xl border-2 border-amber-900/20 bg-sky-100 shadow-xl overflow-hidden"
    >
      <canvas id="arena-canvas" class="block w-full h-full cursor-pointer"></canvas>

      <!-- Win Celebration Screen Flash -->
      <div id="win-flash" class="hidden pointer-events-none absolute inset-0 z-20 bg-amber-200 win-flash-overlay"></div>

      <!-- Handoff Curtain -->
      <div
        id="handoff-overlay"
        class="hidden absolute inset-0 z-20 bg-amber-950/35 backdrop-blur-sm flex items-center justify-center p-4 text-center"
      >
        <div class="w-full max-w-xs rounded-2xl bg-amber-50/95 border-2 border-amber-700/40 p-5 text-slate-900 shadow-2xl animate-pop-in">
          <div id="handoff-title" class="font-display text-lg font-bold text-slate-900"></div>
          <button
            id="btn-start-shooting"
            type="button"
            class="mt-3.5 w-full py-2.5 px-4 rounded-xl font-display font-bold text-sm tracking-wide bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white shadow-lg transition"
          >
            SHOOT
          </button>
        </div>
      </div>

      <!-- Round / Match Win Reaction Overlay -->
      <div
        id="round-result-overlay"
        class="hidden absolute inset-0 z-30 bg-amber-950/40 backdrop-blur-sm flex items-center justify-center p-4 text-center"
      >
        <div id="win-card" class="w-full max-w-sm rounded-2xl bg-gradient-to-b from-white via-amber-50 to-amber-100 border-2 border-amber-500 p-5 sm:p-6 text-slate-900 shadow-2xl animate-pop-in">
          <div id="round-outcome-badge" class="inline-flex items-center px-3 py-1 rounded-full text-[11px] font-display font-bold uppercase tracking-wider mb-1.5 bg-amber-400/30 text-amber-950 border border-amber-600/40"></div>
          <h3 id="round-winner-heading" class="font-display text-2xl sm:text-3xl font-bold text-slate-900 leading-tight"></h3>

          <div class="mt-4 rounded-xl bg-white/90 border border-amber-900/15 p-3 flex items-center justify-around">
            <div>
              <div id="summary-p1-label" class="text-[11px] font-semibold text-slate-600 truncate max-w-[95px]">Player 1</div>
              <div id="summary-p1-score" class="font-display text-xl font-bold text-rose-600">0</div>
            </div>
            <div class="h-7 w-px bg-amber-900/15"></div>
            <div class="font-display text-xs font-bold text-amber-800">TO <span id="target-wins-display">3</span></div>
            <div class="h-7 w-px bg-amber-900/15"></div>
            <div>
              <div id="summary-p2-label" class="text-[11px] font-semibold text-slate-600 truncate max-w-[95px]">Player 2</div>
              <div id="summary-p2-score" class="font-display text-xl font-bold text-sky-700">0</div>
            </div>
          </div>

          <div class="mt-4 flex gap-2">
            <button
              id="btn-next-round"
              type="button"
              class="flex-1 py-2.5 px-4 rounded-xl font-display font-bold text-sm tracking-wide bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white shadow-lg transition"
            >
              NEXT ROUND
            </button>
            <button
              id="btn-rematch"
              type="button"
              class="hidden flex-1 py-2.5 px-4 rounded-xl font-display font-bold text-sm tracking-wide bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white shadow-lg transition"
            >
              PLAY AGAIN
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Compact Bottom Shoot Buttons: 1  2  3  4 -->
    <section
      aria-label="Shoot 1 2 3 4"
      class="relative z-20 max-w-xl w-full mx-auto shrink-0"
    >
      <div class="grid grid-cols-4 gap-2 sm:gap-3">
        <button id="shoot-btn-1" data-block="1" type="button" disabled class="shot-trigger rounded-xl py-2 sm:py-2.5 flex items-center justify-center">
          <span class="font-display text-lg sm:text-xl font-bold text-amber-950 leading-none">1</span>
        </button>

        <button id="shoot-btn-2" data-block="2" type="button" disabled class="shot-trigger rounded-xl py-2 sm:py-2.5 flex items-center justify-center">
          <span class="font-display text-lg sm:text-xl font-bold text-amber-950 leading-none">2</span>
        </button>

        <button id="shoot-btn-3" data-block="3" type="button" disabled class="shot-trigger rounded-xl py-2 sm:py-2.5 flex items-center justify-center">
          <span class="font-display text-lg sm:text-xl font-bold text-amber-950 leading-none">3</span>
        </button>

        <button id="shoot-btn-4" data-block="4" type="button" disabled class="shot-trigger rounded-xl py-2 sm:py-2.5 flex items-center justify-center">
          <span class="font-display text-lg sm:text-xl font-bold text-amber-950 leading-none">4</span>
        </button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      // =========================================================================
      // 1. SOUND ENGINE (Web Audio API)
      // =========================================================================
      // =========================================================================
      // 1. AUDIO IS OFF (every cue is a silent no-op)
      // =========================================================================
      const NO_OP = () => {};
      const audio = new Proxy({ muted: true }, { get: () => NO_OP, set: () => true });

      // =========================================================================
      // 2. GAME STATE
      // =========================================================================
      const TARGET_WINS = 3;
      const MAX_CHANCES = 2;

      const state = {
        players: {
          1: { name: 'Player 1', score: 0 },
          2: { name: 'Player 2', score: 0 }
        },
        round: 1,
        hiderId: 1,
        shooterId: 2,
        phase: 'HIDE', // 'HIDE' | 'TUCKING' | 'HANDOFF' | 'SHOOT' | 'ANIMATING' | 'ROUND_END'
        hiddenBlock: null,
        hidePeekProgress: 0, // 0 -> 1 brief tuck-in animation inside selected block
        coverShiftProgress: 0, // 0 -> 1 deep backward shift along terrace
        targetCoverShift: 0,
        hoveredBlock: null,
        crackedBlocks: new Set(),
        shatteredBlocks: new Set(),
        chancesLeft: MAX_CHANCES,
        lastRoundOutcome: null,
        matchWinnerId: null,
        foundCharacter: false, // True when shooter's bullet finds & reveals the hiding character
        hiderMood: 'hide',     // 'hide' | 'shock' | 'cry' | 'peek' | 'dance'
        moodT: 0,              // seconds inside the current hider reaction
        aimBlock: null         // block the gunman's rifle is trained on right now
      };

      // =========================================================================
      // 3. DOM ELEMENTS
      // =========================================================================
      const els = {
        roundBadge: document.getElementById('round-badge'),
        p1Card: document.getElementById('p1-card'),
        p2Card: document.getElementById('p2-card'),
        p1NameInput: document.getElementById('p1-name-input'),
        p2NameInput: document.getElementById('p2-name-input'),
        p1RoleTag: document.getElementById('p1-role-tag'),
        p2RoleTag: document.getElementById('p2-role-tag'),
        p1Score: document.getElementById('p1-score'),
        p2Score: document.getElementById('p2-score'),

        phasePill: document.getElementById('phase-pill'),
        statusPrompt: document.getElementById('status-prompt'),
        chanceDot1: document.getElementById('chance-dot-1'),
        chanceDot2: document.getElementById('chance-dot-2'),
        chancesText: document.getElementById('chances-text'),

        arenaStage: document.getElementById('arena-stage'),
        arenaCanvas: document.getElementById('arena-canvas'),
        winFlash: document.getElementById('win-flash'),

        handoffOverlay: document.getElementById('handoff-overlay'),
        handoffTitle: document.getElementById('handoff-title'),
        btnStartShooting: document.getElementById('btn-start-shooting'),

        roundResultOverlay: document.getElementById('round-result-overlay'),
        roundOutcomeBadge: document.getElementById('round-outcome-badge'),
        roundWinnerHeading: document.getElementById('round-winner-heading'),
        summaryP1Label: document.getElementById('summary-p1-label'),
        summaryP2Label: document.getElementById('summary-p2-label'),
        summaryP1Score: document.getElementById('summary-p1-score'),
        summaryP2Score: document.getElementById('summary-p2-score'),
        targetWinsDisplay: document.getElementById('target-wins-display'),
        btnNextRound: document.getElementById('btn-next-round'),
        btnRematch: document.getElementById('btn-rematch'),

        shotButtons: [1, 2, 3, 4].map((n) => document.getElementById(`shoot-btn-${n}`)),

        btnResetMatch: document.getElementById('btn-reset-match'),
        toastContainer: document.getElementById('toast-container')
      };

      // =========================================================================
      // 4. GOLDEN-HOUR LIMESTONE TERRACE, TALL BLOCKS & BREAKAGE FX ENGINE
      // =========================================================================
      const ctx = els.arenaCanvas.getContext('2d');
      let stageW = 800;
      let stageH = 420;
      let blockHitboxes = [];
      let bullets = [];
      let slabs = [];
      let dustPuffs = [];
      let sparks = [];
      let confetti = [];
      let shells = [];
      let smokePuffs = [];
      let dustMotes = [];
      let animLoopId = null;
      let lastTime = performance.now();
      let cinematicUntil = 0;

      function initDustMotes() {
        dustMotes = [];
        for (let i = 0; i < 26; i++) {
          dustMotes.push({
            x: Math.random() * 1000,
            y: Math.random() * 600,
            r: 1 + Math.random() * 2.2,
            vx: 6 + Math.random() * 14,
            vy: -4 + Math.random() * 8,
            alpha: 0.25 + Math.random() * 0.45
          });
        }
      }
      initDustMotes();

      function resizeCanvas() {
        const rect = els.arenaStage.getBoundingClientRect();
        stageW = Math.max(320, rect.width);
        stageH = Math.max(240, rect.height);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        els.arenaCanvas.width = Math.floor(stageW * dpr);
        els.arenaCanvas.height = Math.floor(stageH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        computeBlockHitboxes();
        ensureRenderLoop();
      }

      function triggerScreenQuake() {
        els.arenaStage.classList.remove('arena-quake');
        void els.arenaStage.offsetWidth;
        els.arenaStage.classList.add('arena-quake');
      }
      function triggerWinCelebration(cx, cy, isChampion = false) {
        els.winFlash.classList.remove('hidden', 'win-flash-overlay');
        void els.winFlash.offsetWidth;
        els.winFlash.classList.remove('hidden');
        els.winFlash.classList.add('win-flash-overlay');

        const colors = ['#f59e0b', '#10b981', '#0ea5e9', '#f43f5e', '#facc15', '#a855f7'];
        const count = isChampion ? 130 : 65;
        for (let i = 0; i < count; i++) {
          const ang = -Math.PI * Math.random();
          const spd = (isChampion ? 95 : 70) + Math.random() * (isChampion ? 290 : 210);
          confetti.push({
            x: cx + (Math.random() - 0.5) * (isChampion ? 220 : 90),
            y: cy - 10,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - (isChampion ? 110 : 75),
            w: 6 + Math.random() * 6,
            h: 4 + Math.random() * 5,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 8.5,
            color: colors[i % colors.length],
            life: 1,
            decay: isChampion ? 0.28 + Math.random() * 0.22 : 0.36 + Math.random() * 0.25
          });
        }
        ensureRenderLoop();
      }

      function computeBlockHitboxes() {
        const shift = state.coverShiftProgress;
        const padX = Math.max(14, stageW * 0.04);
        const gap = Math.max(10, stageW * 0.022);
        const usableW = stageW - padX * 2 - gap * 3;
        const baseBlockW = Math.min(195, usableW / 4);
        const totalRowW = baseBlockW * 4 + gap * 3;
        const startX = (stageW - totalRowW) / 2;

        // Deep backward slide into perspective courtyard depth (~0.5x scale at full shift)
        const baseGroundY = stageH * 0.86;
        const horizonFloorY = stageH * 0.50;
        const groundY = baseGroundY - shift * (baseGroundY - horizonFloorY);
        const scale = 1 - shift * 0.5;

        // Tall heavy architectural blocks with 2.5D depth
        const baseBlockH = Math.min(220, Math.max(135, stageH * 0.44));
        const blockH = baseBlockH * scale;
        const depth3D = Math.min(38, Math.max(20, baseBlockW * 0.21)) * scale;

        blockHitboxes = [];
        for (let i = 0; i < 4; i++) {
          const num = i + 1;
          const hoverLift = (state.phase === 'HIDE' && state.hoveredBlock === num && !state.shatteredBlocks.has(num)) ? 10 : 0;
          const centerX = startX + i * (baseBlockW + gap) + baseBlockW / 2;
          const scaledW = baseBlockW * scale;
          const x = centerX - scaledW / 2;
          const y = groundY - blockH - hoverLift;

          blockHitboxes.push({
            num,
            x,
            y,
            w: scaledW,
            h: blockH,
            depth: depth3D,
            groundY,
            scale
          });
        }
      }

      // A real round leaves the rifle muzzle and reaches the block in a flash of
      // tracer, kicking sparks, dust and stone out of the impact point.
      function fireTracerToBlock(blockNum, onImpact) {
        computeBlockHitboxes();
        const box = blockHitboxes[blockNum - 1];

        const startX = GUNMAN.muzzleX;
        const startY = GUNMAN.muzzleY;
        const targetX = box ? box.x + box.w / 2 + (Math.random() - .5) * box.w * .16 : stageW * .5;
        const targetY = box ? box.y + box.h * .5 : stageH * .55;

        for (let i = 0; i < 14; i++) {
          const ang = GUNMAN.angle + (Math.random() - 0.5) * .9;
          const spd = 120 + Math.random() * 260;
          sparks.push({
            x: startX,
            y: startY,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            size: 2 + Math.random() * 3.4,
            color: Math.random() > 0.32 ? '#ffe9a8' : '#f97316',
            life: 1,
            decay: 3.4 + Math.random() * 2
          });
        }

        bullets.push({
          x: startX,
          y: startY,
          startX,
          startY,
          targetX,
          targetY,
          progress: 0,
          speed: 6.4, // fast, supersonic travel (~0.16s across the courtyard)
          trail: [{ x: startX, y: startY }],
          done: false,
          onImpact
        });
        ensureRenderLoop();
      }

      function spawnStoneBreakage(box, fullShatter) {
        triggerScreenQuake();
        const cx = box.x + box.w / 2;
        const cy = fullShatter ? box.y + box.h * 0.45 : box.y + box.h * 0.55;
        const s = box.scale || 1;

        const puffCount = fullShatter ? 24 : 11;
        for (let i = 0; i < puffCount; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = (fullShatter ? 55 : 30) + Math.random() * (fullShatter ? 180 : 90);
          dustPuffs.push({
            x: cx + (Math.random() - 0.5) * box.w * 0.7,
            y: cy + (Math.random() - 0.5) * box.h * 0.5,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 35,
            radius: (fullShatter ? 14 : 8) + Math.random() * (fullShatter ? 24 : 12),
            growth: 28 + Math.random() * 34,
            alpha: 0.9,
            decay: 1.15 + Math.random() * 0.7
          });
        }

        const slabCount = fullShatter ? 16 : 6;
        const palette = ['#e6dcc6', '#c9bca2', '#a89e8a', '#9e9076', '#f1eadc'];
        for (let i = 0; i < slabCount; i++) {
          const dir = Math.random() < 0.5 ? -1 : 1;
          const vx = dir * ((fullShatter ? 52 : 30) + Math.random() * (fullShatter ? 145 : 75));
          const vy = -(fullShatter ? 95 : 55) - Math.random() * (fullShatter ? 165 : 85);
          slabs.push({
            x: cx + (Math.random() - 0.5) * box.w * 0.6,
            y: cy + (Math.random() - 0.5) * box.h * 0.4,
            vx,
            vy,
            w: (fullShatter ? 14 : 8) + Math.random() * (fullShatter ? 18 : 10) * Math.max(0.6, s),
            h: (fullShatter ? 10 : 6) + Math.random() * (fullShatter ? 13 : 8) * Math.max(0.6, s),
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 7.5,
            color: palette[i % palette.length],
            floorY: box.groundY - 4,
            bounced: false,
            life: 1,
            decay: 0.48 + Math.random() * 0.25
          });
        }
      }

      // --- Sunlit Alpine Villa Stone Courtyard & Distant Peaks ---
      function drawTerraceBackground(dt) {
        const horizonY = stageH * 0.43;

        // Crisp daylight sky with warm alpine atmospheric haze
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY + stageH * 0.08);
        skyGrad.addColorStop(0, '#1e3a8a');
        skyGrad.addColorStop(0.32, '#60a5fa');
        skyGrad.addColorStop(0.72, '#dbeafe');
        skyGrad.addColorStop(1, '#e2e8f0');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, stageW, horizonY + stageH * 0.08);

        // Warm sun & soft atmospheric glow
        const sunX = stageW * 0.82;
        const sunY = stageH * 0.11;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, Math.max(stageW, stageH) * 0.62);
        sunGlow.addColorStop(0, 'rgba(239, 246, 255, 0.78)');
        sunGlow.addColorStop(0.2, 'rgba(191, 219, 254, 0.25)');
        sunGlow.addColorStop(0.6, 'rgba(219, 234, 254, 0.10)');
        sunGlow.addColorStop(1, 'rgba(219, 234, 254, 0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(0, 0, stageW, stageH * 0.88);

        // Soft volumetric sun rays
        ctx.save();
        ctx.globalAlpha = 0.12;
        for (let b = 0; b < 3; b++) {
          ctx.beginPath();
          ctx.moveTo(sunX, sunY);
          ctx.lineTo(stageW * (0.08 + b * 0.25), stageH * 0.88);
          ctx.lineTo(stageW * (0.24 + b * 0.25), stageH * 0.88);
          ctx.closePath();
          ctx.fillStyle = '#eff6ff';
          ctx.fill();
        }
        ctx.restore();

        // Distant alpine ridge (cool atmospheric blue-slate)
        ctx.fillStyle = '#7da2c1';
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(stageW * 0.12, horizonY - stageH * 0.12);
        ctx.lineTo(stageW * 0.25, horizonY - stageH * 0.06);
        ctx.lineTo(stageW * 0.42, horizonY - stageH * 0.15);
        ctx.lineTo(stageW * 0.58, horizonY - stageH * 0.07);
        ctx.lineTo(stageW * 0.76, horizonY - stageH * 0.13);
        ctx.lineTo(stageW * 0.91, horizonY - stageH * 0.06);
        ctx.lineTo(stageW, horizonY - stageH * 0.10);
        ctx.lineTo(stageW, horizonY);
        ctx.closePath();
        ctx.fill();

        // Soft snow/sun highlight on alpine peaks
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.beginPath();
        ctx.moveTo(stageW * 0.42, horizonY - stageH * 0.15);
        ctx.lineTo(stageW * 0.46, horizonY - stageH * 0.10);
        ctx.lineTo(stageW * 0.38, horizonY - stageH * 0.10);
        ctx.closePath();
        ctx.fill();

        // Mid-ground terraced hills
        ctx.fillStyle = '#8ba6b8';
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.quadraticCurveTo(stageW * 0.24, horizonY - stageH * 0.055, stageW * 0.52, horizonY - stageH * 0.025);
        ctx.quadraticCurveTo(stageW * 0.78, horizonY - stageH * 0.065, stageW, horizonY - stageH * 0.02);
        ctx.lineTo(stageW, horizonY);
        ctx.closePath();
        ctx.fill();

        // Slender cypress tree silhouettes along villa edge
        const cypressPositions = [0.07, 0.11, 0.89, 0.935];
        cypressPositions.forEach((fx, idx) => {
          const cx = stageW * fx;
          const baseY = horizonY - stageH * 0.005;
          const th = stageH * (idx % 2 === 0 ? 0.11 : 0.085);
          const tw = Math.max(7, stageW * 0.014);

          ctx.fillStyle = '#3f5e42';
          ctx.beginPath();
          ctx.moveTo(cx, baseY - th);
          ctx.quadraticCurveTo(cx + tw * 1.1, baseY - th * 0.45, cx, baseY);
          ctx.quadraticCurveTo(cx - tw * 1.1, baseY - th * 0.45, cx, baseY - th);
          ctx.fill();
        });

        // Villa stone balustrade / parapet wall
        const wallTopY = horizonY - 2;
        const wallH = stageH * 0.052;
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(0, wallTopY, stageW, wallH);

        // Baluster posts along balustrade
        ctx.fillStyle = '#94a3b8';
        const postStep = Math.max(26, stageW * 0.042);
        for (let x = postStep * 0.5; x < stageW; x += postStep) {
          ctx.fillRect(x - 3, wallTopY + 3, 6, wallH - 4);
        }

        // Top marble coping cap
        ctx.fillStyle = '#f1f5f9';
        ctx.fillRect(0, wallTopY - 3, stageW, 4);
        ctx.strokeStyle = 'rgba(115, 82, 46, 0.28)';
        ctx.lineWidth = 1;
        ctx.strokeRect(0, wallTopY - 3, stageW, 4);

        // Warm Sunlit Marble / Travertine Flagstone Courtyard Floor
        const floorY = wallTopY + wallH;
        const floorGrad = ctx.createLinearGradient(0, floorY, 0, stageH);
        floorGrad.addColorStop(0, '#cbd5e1');
        floorGrad.addColorStop(0.42, '#aebdce');
        floorGrad.addColorStop(1, '#8295aa');
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, floorY, stageW, stageH - floorY);

        // Perspective travertine flagstone joints & subtle stone variation
        const rows = 6;
        const vanishX = stageW * 0.5;
        const vanishY = horizonY - stageH * 0.22;

        for (let r = 0; r < rows; r++) {
          const t0 = Math.pow(r / rows, 1.38);
          const t1 = Math.pow((r + 1) / rows, 1.38);
          const y0 = floorY + t0 * (stageH - floorY);
          const y1 = floorY + t1 * (stageH - floorY);

          // Horizontal mortar joint
          ctx.strokeStyle = 'rgba(110, 78, 42, 0.22)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(0, y1);
          ctx.lineTo(stageW, y1);
          ctx.stroke();

          // Alternating flagstone subtle warmth
          const cols = 8;
          for (let c = 0; c < cols; c++) {
            if ((r + c) % 3 === 0) {
              const bx0 = (c / cols) * stageW;
              const bx1 = ((c + 1) / cols) * stageW;
              const tx0 = vanishX + (bx0 - vanishX) * (0.48 + t0 * 0.52);
              const tx1 = vanishX + (bx1 - vanishX) * (0.48 + t0 * 0.52);
              const mx0 = vanishX + (bx0 - vanishX) * (0.48 + t1 * 0.52);
              const mx1 = vanishX + (bx1 - vanishX) * (0.48 + t1 * 0.52);

              ctx.fillStyle = 'rgba(255, 250, 238, 0.22)';
              ctx.beginPath();
              ctx.moveTo(tx0, y0);
              ctx.lineTo(tx1, y0);
              ctx.lineTo(mx1, y1);
              ctx.lineTo(mx0, y1);
              ctx.closePath();
              ctx.fill();
            }
          }
        }

        // Perspective vertical flagstone joints
        const cols = 8;
        ctx.strokeStyle = 'rgba(110, 78, 42, 0.18)';
        ctx.lineWidth = 1.1;
        for (let c = 1; c < cols; c++) {
          const bx = (c / cols) * stageW;
          ctx.beginPath();
          ctx.moveTo(vanishX + (bx - vanishX) * 0.48, floorY);
          ctx.lineTo(bx, stageH);
          ctx.stroke();
        }

        // Drifting golden dust motes
        ctx.save();
        for (let i = 0; i < dustMotes.length; i++) {
          const m = dustMotes[i];
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          if (m.x > stageW + 10) m.x = -10;
          if (m.y < 10) m.y = stageH - 10;
          if (m.y > stageH - 10) m.y = 10;

          ctx.globalAlpha = m.alpha;
          ctx.fillStyle = '#eff6ff';
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // REAL CHARACTERS
      // The hider is a full body (boots, legs, jacket, arms, head, face) that
      // crouches behind the chosen block, is thrown into the open when a bullet
      // finds him, sobs when caught and dances when he survives the turn.
      // -----------------------------------------------------------------------
      const HIDER_PALETTES = {
        1: { shirt: '#e11d48', shirtDark: '#9f1239', skin: '#f4c7a1', skinShade: '#d6a077', hair: '#2a1a12', pants: '#1f2b3a', boot: '#101827' },
        2: { shirt: '#0284c7', shirtDark: '#075985', skin: '#e7b48d', skinShade: '#c68f68', hair: '#241811', pants: '#22303f', boot: '#101827' }
      };

      function paintLimb(x1, y1, x2, y2, w, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      // Drawn in a 100-unit-tall local space with the feet at 0, so any block
      // height maps cleanly onto a human figure.
      function drawHiderCharacter(cx, feetY, heightPx, mood, t, playerId, hint) {
        const pal = HIDER_PALETTES[playerId] || HIDER_PALETTES[1];
        const k = heightPx / 100;
        if (k <= 0.01) return;
        const sway = Math.sin(t * 2.4);
        const beat = Math.sin(t * 7.5);

        let hipY = -46, shoulderY = -78, headY = -92, lean = 0, bob = 0, tilt = 0;
        let handL = { x: -16, y: -51 }, handR = { x: 16, y: -51 };
        let eye = 1, brow = 0, mouth = 'flat', tears = 0, blush = 0;

        switch (mood) {
          case 'hide':
            hipY = -27; shoulderY = -52; headY = -66;
            handL = { x: -14, y: hint ? -104 : -95 };
            handR = { x: 14, y: hint ? -104 : -95 };
            eye = .55; brow = .35; lean = -1.5;
            break;
          case 'shock':
            handL = { x: -27, y: -99 }; handR = { x: 27, y: -99 };
            eye = 1.25; brow = 1; mouth = 'open';
            bob = Math.sin(t * 26) * 1.4;
            break;
          case 'cry':
            hipY = -43; shoulderY = -73; headY = -87;
            handL = { x: -8, y: -97 }; handR = { x: 8, y: -97 };
            eye = 0; brow = .8; mouth = 'sob'; tears = 1;
            tilt = Math.sin(t * 3.2) * 7;
            bob = Math.sin(t * 18) * 1.6;
            break;
          case 'dance':
            hipY = -46 - Math.abs(beat) * 5;
            shoulderY = -78 - Math.abs(beat) * 5;
            headY = -92 - Math.abs(beat) * 5;
            handL = { x: -30 - sway * 5, y: -103 - Math.max(0, beat) * 10 };
            handR = { x: 30 - sway * 5, y: -103 - Math.max(0, -beat) * 10 };
            lean = sway * 5; mouth = 'smile'; eye = .7; blush = .5;
            break;
          case 'peek':
            handL = { x: -24, y: -74 }; handR = { x: 22, y: -66 };
            brow = .5; mouth = 'open'; lean = -4;
            break;
        }

        ctx.save();
        ctx.translate(cx + lean * .7, feetY + bob);
        ctx.scale(k, k);
        ctx.lineJoin = 'round';

        // Contact shadow keeps him planted on the flagstones.
        ctx.fillStyle = 'rgba(24, 18, 8, 0.26)';
        ctx.beginPath();
        ctx.ellipse(0, 1, 27, 6.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // ---- Boots & legs ----
        const feet = [[-13, -2], [13, 1]];
        for (let i = 0; i < 2; i++) {
          const side = i === 0 ? -1 : 1;
          const kneeX = side * 9;
          const kneeY = hipY * .52;
          paintLimb(side * 6.5, hipY, kneeX, kneeY, 12, pal.pants);
          paintLimb(kneeX, kneeY, feet[i][0], feet[i][1] - 4, 10, pal.pants);
          ctx.fillStyle = pal.boot;
          ctx.beginPath();
          ctx.roundRect(feet[i][0] + (side < 0 ? -8 : -5), feet[i][1] - 6, 14, 7, 3.5);
          ctx.fill();
        }

        // ---- Torso: jacket, belt, zip ----
        const torsoTop = shoulderY - 2;
        const torsoH = Math.max(10, (hipY + 8) - torsoTop);
        ctx.fillStyle = pal.shirt;
        ctx.beginPath();
        ctx.roundRect(-15, torsoTop, 30, torsoH, 10);
        ctx.fill();
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(-15, torsoTop, 30, torsoH, 10);
        ctx.clip();
        ctx.fillStyle = 'rgba(8, 20, 38, .17)';
        ctx.fillRect(5, torsoTop, 12, torsoH);
        ctx.fillStyle = 'rgba(255, 255, 255, .15)';
        ctx.fillRect(-14, torsoTop + 1, 6, torsoH - 2);
        ctx.fillStyle = pal.shirtDark;
        ctx.fillRect(-1, torsoTop + 4, 2, torsoH - 12);
        ctx.restore();
        ctx.fillStyle = '#141f2c';
        ctx.beginPath();
        ctx.roundRect(-15, hipY + 1, 30, 7, 3);
        ctx.fill();
        ctx.fillStyle = '#e2b33c';
        ctx.fillRect(-3.5, hipY + 1.6, 7, 5.8);

        // ---- Head & face ----
        ctx.save();
        ctx.translate(0, headY);
        ctx.rotate(tilt * Math.PI / 180);

        ctx.fillStyle = pal.skinShade;
        ctx.fillRect(-5, 7, 10, 9);

        ctx.fillStyle = pal.skin;
        ctx.beginPath();
        ctx.ellipse(0, 0, 11.5, 12.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-11.2, 1.5, 2.6, 3.4, 0, 0, Math.PI * 2);
        ctx.ellipse(11.2, 1.5, 2.6, 3.4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = pal.hair;
        ctx.beginPath();
        ctx.ellipse(0, -3.5, 11.8, 9.8, 0, Math.PI * 1.02, Math.PI * 1.98);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-9.2, -4, 3.2, 6.2, .28, 0, Math.PI * 2);
        ctx.fill();

        if (blush) {
          ctx.fillStyle = 'rgba(244, 114, 130, .38)';
          ctx.beginPath();
          ctx.ellipse(-7.4, 3.4, 2.8, 1.8, 0, 0, Math.PI * 2);
          ctx.ellipse(7.4, 3.4, 2.8, 1.8, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        if (mood === 'cry') {
          ctx.strokeStyle = '#243244';
          ctx.lineWidth = 1.9;
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(-6.6, -2.6); ctx.lineTo(-3.4, -.4); ctx.lineTo(-.9, -2.9); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(.9, -2.9); ctx.lineTo(3.4, -.4); ctx.lineTo(6.6, -2.6); ctx.stroke();
        } else {
          [-4.6, 4.6].forEach((ex) => {
            ctx.fillStyle = '#fffaf2';
            ctx.beginPath();
            ctx.ellipse(ex, -1, 2.9, 3.1 * eye, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1d2a3a';
            ctx.beginPath();
            ctx.arc(ex + .3, -.7, 1.5 * Math.max(.75, Math.min(1.2, eye - .2)), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,.92)';
            ctx.beginPath();
            ctx.arc(ex - .7, -1.7, .55, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        ctx.strokeStyle = pal.hair;
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        if (brow > 0) {
          ctx.beginPath(); ctx.moveTo(-7.4, -6.4 - brow); ctx.lineTo(-2.4, -7.5 - brow); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(2.4, -7.5 - brow); ctx.lineTo(7.4, -6.4 - brow); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.moveTo(-7, -6.6); ctx.lineTo(-2.6, -6.2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(2.6, -6.2); ctx.lineTo(7, -6.6); ctx.stroke();
        }

        ctx.lineWidth = 1.7;
        ctx.strokeStyle = '#8a4a3c';
        if (mouth === 'open' || mouth === 'sob') {
          ctx.fillStyle = '#5b2b26';
          ctx.beginPath();
          ctx.ellipse(0, 3.8, mouth === 'sob' ? 3.2 : 2.6, mouth === 'sob' ? 4.1 : 3.1, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (mouth === 'smile') {
          ctx.beginPath(); ctx.arc(0, 2.2, 3.4, .25, Math.PI - .25); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.moveTo(-2.6, 3.9); ctx.lineTo(2.6, 3.9); ctx.stroke();
        }

        if (tears) {
          ctx.fillStyle = 'rgba(96, 165, 250, .92)';
          for (let i = 0; i < 3; i++) {
            const p = (t * 1.3 + i * .33) % 1;
            const tx = i % 2 ? 4.6 : -4.6;
            ctx.beginPath();
            ctx.ellipse(tx, 1 + p * 15, 1.7, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();

        // ---- Arms (drawn last so raised hands sit over the face) ----
        [
          { side: -1, hand: handL, col: pal.shirtDark },
          { side: 1, hand: handR, col: pal.shirt }
        ].forEach(({ side, hand, col }) => {
          const sx = side * 14.5;
          const sy = shoulderY + 4;
          const ex = (sx + hand.x) / 2 + side * 5.5;
          const ey = (sy + hand.y) / 2 + 2.5;
          paintLimb(sx, sy, ex, ey, 9.5, col);
          paintLimb(ex, ey, hand.x, hand.y, 8.2, pal.skin);
          ctx.fillStyle = pal.skin;
          ctx.beginPath(); ctx.arc(hand.x, hand.y, 4.6, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = 'rgba(90, 60, 40, .35)';
          ctx.lineWidth = .8;
          ctx.beginPath(); ctx.arc(hand.x, hand.y, 4.6, 0, Math.PI * 2); ctx.stroke();
        });

        ctx.restore();
      }

      // The exposed hider: thrown out from the broken block, sobbing, or safely
      // stepping out in front of his block for a victory dance.
      function drawHiderForeground() {
        const box = state.hiddenBlock != null ? blockHitboxes[state.hiddenBlock - 1] : null;
        if (!box) return;
        const s = box.scale || 1;
        const cx = box.x + box.w / 2;
        const mood = state.hiderMood;
        if (mood === 'shock' || mood === 'cry') {
          drawHiderCharacter(cx, box.groundY - box.h * .06 * s, box.h * .84, mood, state.moodT, state.hiderId, false);
        } else if (mood === 'peek') {
          const out = Math.min(1, state.moodT / .45);
          drawHiderCharacter(cx + (1 - out) * box.w * .18, box.groundY + 4 * s, box.h * .86, 'peek', state.moodT, state.hiderId, false);
        } else if (mood === 'dance') {
          const step = Math.min(1, state.moodT / .55);
          const x = cx + Math.sin(state.moodT * 2.1) * 12 * s;
          drawHiderCharacter(x, box.groundY + (8 + 12 * step) * s, box.h * .92, 'dance', state.moodT, state.hiderId, false);
        }
      }

      // -----------------------------------------------------------------------
      // THE SHOOTER: a man on the terrace with a rifle that really tracks the
      // block his bullet is about to hit.
      // -----------------------------------------------------------------------
      const GUNMAN = {
        alpha: 0, aimX: 0, aimY: 0, angle: -.3, recoil: 0, muzzle: 0,
        muzzleX: 0, muzzleY: 0, pivotX: 0, pivotY: 0, t: 0, ready: false, flashSeed: 0
      };
      const GUN_LOCAL = { pivotX: 8, pivotY: -74, muzzleX: 62 };

      // Foreground framing: a man cropped by the bottom-left corner, scaled to
      // the same world as the stone blocks so the scene keeps one perspective.
      function gunmanLayout() {
        const blockH = Math.min(220, Math.max(135, stageH * .44));
        const bodyH = Math.min(blockH * .95, stageH * .5);
        const k = Math.max(.6, bodyH / 100);
        return {
          k,
          cx: Math.max(stageW * .045, 10),
          feetY: stageH * 1.05
        };
      }

      function updateGunman(dt) {
        const visible = state.phase === 'HANDOFF' || state.phase === 'SHOOT' ||
          state.phase === 'ANIMATING';
        const targetAlpha = visible ? 1 : 0;
        GUNMAN.alpha += (targetAlpha - GUNMAN.alpha) * Math.min(1, dt * 7);
        if (GUNMAN.alpha < .004) GUNMAN.alpha = 0;

        const lay = gunmanLayout();
        const px = lay.cx + GUN_LOCAL.pivotX * lay.k;
        const py = lay.feetY + GUN_LOCAL.pivotY * lay.k;

        const box = state.aimBlock ? blockHitboxes[state.aimBlock - 1] : null;
        let tx, ty;
        if (box) {
          tx = box.x + box.w * .5;
          ty = box.y + box.h * .45;
        } else {
          const mid = blockHitboxes[1];
          tx = mid ? mid.x + mid.w * .5 : stageW * .5;
          ty = mid ? mid.y + mid.h * .45 : stageH * .5;
        }
        if (!GUNMAN.ready) { GUNMAN.aimX = tx; GUNMAN.aimY = ty; GUNMAN.ready = true; }
        const ease = 1 - Math.exp(-dt * 11);
        GUNMAN.aimX += (tx - GUNMAN.aimX) * ease;
        GUNMAN.aimY += (ty - GUNMAN.aimY) * ease;

        GUNMAN.t += dt;
        const sway = Math.sin(GUNMAN.t * 1.7) * .009 + Math.sin(GUNMAN.t * 4.1) * .0035;
        GUNMAN.recoil += (0 - GUNMAN.recoil) * Math.min(1, dt * 9);
        if (GUNMAN.muzzle > 0) GUNMAN.muzzle = Math.max(0, GUNMAN.muzzle - dt);

        GUNMAN.angle = Math.atan2(GUNMAN.aimY - py, GUNMAN.aimX - px) + sway;
        const drawAngle = GUNMAN.angle + GUNMAN.recoil * .085;
        const reach = (GUN_LOCAL.muzzleX - GUNMAN.recoil * 4) * lay.k;
        GUNMAN.pivotX = px;
        GUNMAN.pivotY = py;
        GUNMAN.muzzleX = px + Math.cos(drawAngle) * reach;
        GUNMAN.muzzleY = py + Math.sin(drawAngle) * reach;
      }

      function drawGunman() {
        if (GUNMAN.alpha <= .015) return;
        const lay = gunmanLayout();
        const k = lay.k;
        const recoil = GUNMAN.recoil;
        const skin = '#c99368';
        const skinShade = '#a97850';
        const shirt = state.shooterId === 1 ? '#26374b' : '#203a4c';
        const shirtShade = '#16222f';
        const pants = '#19232f';

        ctx.save();
        ctx.globalAlpha = GUNMAN.alpha;

        // Grounded shadow under the whole stance.
        ctx.fillStyle = 'rgba(12, 18, 28, .3)';
        ctx.beginPath();
        ctx.ellipse(lay.cx + 4 * k, lay.feetY - 4 * k, 38 * k, 7 * k, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.translate(lay.cx, lay.feetY);
        ctx.scale(k, k);
        ctx.lineJoin = 'round';

        // ---- Braced legs ----
        paintLimb(-4, -46, -16, -24, 15, pants);
        paintLimb(-16, -24, -18, -4, 13, pants);
        paintLimb(5, -46, 13, -24, 15, pants);
        paintLimb(13, -24, 17, -3, 13, pants);
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.roundRect(-27, -7, 19, 8, 4); ctx.fill();
        ctx.beginPath(); ctx.roundRect(9, -7, 19, 8, 4); ctx.fill();

        // ---- Torso, harness, belt ----
        ctx.fillStyle = shirt;
        ctx.beginPath();
        ctx.roundRect(-14, -78, 28, 36, 11);
        ctx.fill();
        ctx.fillStyle = shirtShade;
        ctx.beginPath();
        ctx.roundRect(-14, -56, 28, 14, 6);
        ctx.fill();
        ctx.strokeStyle = 'rgba(10, 18, 28, .55)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-9, -74); ctx.lineTo(6, -47); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(9, -74); ctx.lineTo(-2, -47); ctx.stroke();
        ctx.fillStyle = '#0d1520';
        ctx.beginPath(); ctx.roundRect(-14, -46, 28, 7, 3); ctx.fill();

        // ---- Neck, head and field cap ----
        ctx.fillStyle = skinShade;
        ctx.fillRect(-5, -86, 10, 9);
        ctx.fillStyle = skin;
        ctx.beginPath(); ctx.ellipse(1, -93, 11, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = skinShade;
        ctx.beginPath(); ctx.ellipse(-8.4, -92, 2.4, 3.2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#241811';
        ctx.beginPath(); ctx.ellipse(1, -97, 10.8, 7, 0, Math.PI * .95, Math.PI * 2.05); ctx.fill();
        ctx.fillStyle = '#12212e';
        ctx.beginPath(); ctx.ellipse(1, -99, 11.5, 7.5, 0, Math.PI, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(9.5, -99, 6.5, 2.6, -.18, 0, Math.PI * 2); ctx.fill();

        // ---- Arms + rifle: one group pivoting at the shoulder ----
        ctx.save();
        ctx.translate(GUN_LOCAL.pivotX, GUN_LOCAL.pivotY);
        ctx.rotate(GUNMAN.angle + recoil * .085);
        ctx.translate(-recoil * 4, 0);

        // Support arm reaching down the foregrip.
        paintLimb(0, -2, 24, 4, 9.5, shirt);
        paintLimb(24, 4, 37, 2, 8.2, skin);
        // Trigger arm tucked in close.
        paintLimb(-1, 3, 6, 4, 9.5, shirtShade);

        // Stock
        ctx.fillStyle = '#5a3b23';
        ctx.beginPath();
        ctx.moveTo(-24, -2.5); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4.5); ctx.lineTo(-22, 6.5);
        ctx.closePath(); ctx.fill();
        // Receiver
        ctx.fillStyle = '#20262e';
        ctx.beginPath(); ctx.roundRect(-4, -5, 30, 9, 2); ctx.fill();
        ctx.fillStyle = '#39424d';
        ctx.fillRect(-4, -5, 30, 1.8);
        // Magazine
        ctx.fillStyle = '#171d24';
        ctx.beginPath(); ctx.roundRect(8, 3, 9, 12, 2); ctx.fill();
        // Barrel + muzzle brake
        ctx.fillStyle = '#20262e';
        ctx.beginPath(); ctx.roundRect(25, -3.6, 30, 5, 2); ctx.fill();
        ctx.fillStyle = '#2c343d';
        ctx.beginPath(); ctx.roundRect(53, -4.6, 9, 7.4, 2); ctx.fill();
        // Optic rail + front sight
        ctx.fillStyle = '#0f1419';
        ctx.fillRect(1, -7.4, 15, 2.6);
        ctx.fillRect(28, -6.6, 4, 2.2);

        // Hands over the furniture.
        ctx.fillStyle = skin;
        ctx.beginPath(); ctx.arc(7, 2, 4.7, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(37, 2, 4.4, 0, Math.PI * 2); ctx.fill();

        // ---- Muzzle flash ----
        if (GUNMAN.muzzle > 0) {
          const f = Math.max(0, Math.min(1, GUNMAN.muzzle / .09));
          const ang = GUNMAN.flashSeed;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.translate(62, -1);
          ctx.rotate(ang);
          const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, 30 * f + 4);
          glow.addColorStop(0, 'rgba(255, 255, 240, ' + (f).toFixed(2) + ')');
          glow.addColorStop(.35, 'rgba(255, 210, 90, ' + (f * .8).toFixed(2) + ')');
          glow.addColorStop(1, 'rgba(255, 140, 30, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath(); ctx.arc(0, 0, 30 * f + 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255, 246, 214, ' + (f * .95).toFixed(2) + ')';
          for (let i = 0; i < 5; i++) {
            const a = i * (Math.PI * 2 / 5) + ang;
            const len = (16 + (i % 2) * 9) * f;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * 3, Math.sin(a) * 3);
            ctx.lineTo(Math.cos(a + .28) * len * .55, Math.sin(a + .28) * len * .55);
            ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }

        ctx.restore();
        ctx.restore();
      }

      function spawnShell() {
        const lay = gunmanLayout();
        shells.push({
          x: GUNMAN.pivotX + 4 * lay.k,
          y: GUNMAN.pivotY - 2 * lay.k,
          vx: 40 + Math.random() * 50,
          vy: -(130 + Math.random() * 70),
          rot: Math.random() * 6.28,
          vRot: 9 + Math.random() * 9,
          floorY: lay.feetY - 8 * lay.k,
          life: 1,
          bounced: false,
          size: Math.max(2.2, 1.4 * lay.k)
        });
      }

      function spawnMuzzleSmoke() {
        for (let i = 0; i < 6; i++) {
          const a = GUNMAN.angle + (Math.random() - .5) * .7;
          const spd = 18 + Math.random() * 46;
          smokePuffs.push({
            x: GUNMAN.muzzleX,
            y: GUNMAN.muzzleY,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd - 10,
            r: 3 + Math.random() * 4,
            grow: 16 + Math.random() * 20,
            life: 1
          });
        }
      }

      // Deterministic pseudo-random helper for crisp granite/limestone mineral grain
      function seededNoise(seed) {
        const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function drawTallStoneBlock(box) {
        const { num, x, y, w, h, depth, groundY } = box;
        const s = box.scale || 1;
        const isShattered = state.shatteredBlocks.has(num);
        const isCracked = state.crackedBlocks.has(num);
        const isHovered = state.phase === 'HIDE' && state.hoveredBlock === num && !isShattered;

        // Ambient occlusion & ground contact shadow
        ctx.fillStyle = isShattered ? 'rgba(78, 54, 20, 0.14)' : 'rgba(78, 54, 20, 0.36)';

        if (isShattered) {
          // Low shattered base rubble
          const stumpH = h * 0.18;
          const stumpY = groundY - stumpH;
          ctx.fillStyle = '#a89f8d';
          ctx.beginPath();
          ctx.roundRect(x + w * 0.12, stumpY, w * 0.76, stumpH, 4 * s);
          ctx.fill();
          ctx.lineWidth = Math.max(1.2, 2 * s);
          ctx.strokeStyle = '#57534e';
          ctx.stroke();

          return;
        }

        const dx = depth * 0.72;
        const dy = depth * 0.58;

        // 2.5D Top Bevel Face (sun-lit limestone/granite)
        ctx.fillStyle = isHovered ? '#fcfaf5' : '#f1eadc';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + dx, y - dy);
        ctx.lineTo(x + w + dx, y - dy);
        ctx.lineTo(x + w, y);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = Math.max(1.2, 1.8 * s);
        ctx.strokeStyle = '#57534e';
        ctx.stroke();

        // 2.5D Right Side Face (shaded architectural granite/limestone)
        const sideGrad = ctx.createLinearGradient(x + w, y, x + w + dx, y + h);
        sideGrad.addColorStop(0, '#a89e8a');
        sideGrad.addColorStop(1, '#857b68');
        ctx.fillStyle = sideGrad;
        ctx.beginPath();
        ctx.moveTo(x + w, y);
        ctx.lineTo(x + w + dx, y - dy);
        ctx.lineTo(x + w + dx, y + h - dy);
        ctx.lineTo(x + w, y + h);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Front Tall Heavy Stone Face
        const radius = Math.max(4, 8 * s);
        const faceGrad = ctx.createLinearGradient(x, y, x + w, y + h);
        faceGrad.addColorStop(0, isHovered ? '#f7f1e5' : '#e6dcc6');
        faceGrad.addColorStop(0.55, '#c9bca2');
        faceGrad.addColorStop(1, '#9e9076');
        ctx.fillStyle = faceGrad;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.fill();

        // Clip inside front face for granite/limestone mineral grain & mortar seams
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.clip();

        // Subtle top-left bevel highlight & bottom-right ambient occlusion
        ctx.strokeStyle = 'rgba(255, 253, 247, 0.55)';
        ctx.lineWidth = Math.max(1.5, 2.5 * s);
        ctx.beginPath();
        ctx.moveTo(x + 2, y + h - 2);
        ctx.lineTo(x + 2, y + 2);
        ctx.lineTo(x + w - 2, y + 2);
        ctx.stroke();

        // Granite speckles & mineral grain
        const speckCount = 26;
        for (let i = 0; i < speckCount; i++) {
          const n1 = seededNoise(num * 100 + i * 3 + 1);
          const n2 = seededNoise(num * 100 + i * 3 + 2);
          const n3 = seededNoise(num * 100 + i * 3 + 3);
          const sx = x + n1 * w;
          const sy = y + n2 * h;
          const sr = Math.max(1, (1.2 + n3 * 2.2) * s);
          ctx.fillStyle = n3 > 0.5 ? 'rgba(68, 64, 60, 0.22)' : 'rgba(255, 252, 245, 0.24)';
          ctx.beginPath();
          ctx.arc(sx, sy, sr, 0, Math.PI * 2);
          ctx.fill();
        }

        // Architectural stone courses / mortar joints
        ctx.strokeStyle = 'rgba(56, 51, 46, 0.34)';
        ctx.lineWidth = Math.max(1, 1.5 * s);
        [0.25, 0.5, 0.75].forEach((frac, idx) => {
          const lineY = y + h * frac;
          ctx.beginPath();
          ctx.moveTo(x, lineY);
          ctx.lineTo(x + w, lineY);
          ctx.stroke();

          // Staggered vertical block joint
          const jointX = x + w * (idx % 2 === 0 ? 0.34 : 0.66);
          const prevY = y + h * (frac - 0.25);
          ctx.beginPath();
          ctx.moveTo(jointX, prevY);
          ctx.lineTo(jointX, lineY);
          ctx.stroke();
        });

        ctx.restore();

        // Outer border stroke
        ctx.lineWidth = isHovered ? 3 : Math.max(1.4, 2.2 * s);
        ctx.strokeStyle = isHovered ? '#d97706' : isCracked ? '#e11d48' : '#44403c';
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.stroke();

        // Fracture cracks if hit once
        if (isCracked) {
          ctx.strokeStyle = '#292524';
          ctx.lineWidth = Math.max(1.5, 2.5 * s);
          ctx.beginPath();
          ctx.moveTo(x + w * 0.25, y + 8 * s);
          ctx.lineTo(x + w * 0.45, y + h * 0.32);
          ctx.lineTo(x + w * 0.3, y + h * 0.62);
          ctx.lineTo(x + w * 0.58, y + h - 8 * s);
          ctx.stroke();
        }

        // Clean Block Number
        ctx.fillStyle = '#1c1917';
        ctx.font = `700 ${Math.max(13, Math.min(36, Math.floor(w * 0.26)))}px "Chakra Petch", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(num), x + w / 2, y + h * 0.52);
      }

      function renderFrame(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;
        const fxDt = dt * (now < cinematicUntil ? 0.42 : 1);

        // Smooth, slow backward cover shift
        const shiftDiff = state.targetCoverShift - state.coverShiftProgress;
        if (Math.abs(shiftDiff) > 0.001) {
          state.coverShiftProgress += shiftDiff * Math.min(1, dt * 2.6);
        } else {
          state.coverShiftProgress = state.targetCoverShift;
        }

        // Reaction clock for the hider, plus the gunman's aim/recoil/breathing.
        state.moodT += dt;
        computeBlockHitboxes();
        updateGunman(dt);
        ctx.clearRect(0, 0, stageW, stageH);

        drawTerraceBackground(dt);

        // The tucked hider is painted before his block so the stone really covers
        // him; only during his own tuck-in do his fingertips show over the top.
        const liveHider = state.hiddenBlock != null ? blockHitboxes[state.hiddenBlock - 1] : null;
        blockHitboxes.forEach((box) => {
          if (liveHider === box && state.hiderMood === 'hide') {
            const s = box.scale || 1;
            drawHiderCharacter(
              box.x + box.w / 2,
              box.groundY + 2 * s,
              box.h * 1.02,
              'hide',
              state.moodT,
              state.hiderId,
              state.phase === 'TUCKING'
            );
          }
          drawTallStoneBlock(box);
        });

        // Exposed hider (caught, survived, dancing) then the shooter in front.
        drawHiderForeground();
        drawGunman();

        // Flying stone slabs
        for (let i = slabs.length - 1; i >= 0; i--) {
          const s = slabs[i];
          s.x += s.vx * fxDt;
          s.y += s.vy * fxDt;
          s.vy += 460 * fxDt;
          s.rot += s.vRot * fxDt;

          if (s.y >= s.floorY) {
            s.y = s.floorY;
            if (!s.bounced) {
              s.bounced = true;
              s.vy = -Math.abs(s.vy) * 0.32;
              s.vx *= 0.65;
              s.vRot *= 0.55;
            } else {
              s.vy = 0;
              s.vx *= 0.8;
              s.vRot = 0;
            }
          }

          s.life -= s.decay * fxDt;
          if (s.life <= 0) {
            slabs.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 1.25));
          ctx.translate(s.x, s.y);
          ctx.rotate(s.rot);
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.roundRect(-s.w / 2, -s.h / 2, s.w, s.h, 3);
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#44403c';
          ctx.stroke();
          ctx.restore();
        }

        // Dust clouds
        for (let i = dustPuffs.length - 1; i >= 0; i--) {
          const d = dustPuffs[i];
          d.x += d.vx * fxDt;
          d.y += d.vy * fxDt;
          d.vx *= 0.96;
          d.vy *= 0.96;
          d.radius += d.growth * fxDt;
          d.alpha -= d.decay * fxDt;

          if (d.alpha <= 0) {
            dustPuffs.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, d.alpha * 0.62);
          ctx.fillStyle = '#efe1c6';
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Ejected brass and muzzle smoke.
        for (let i = shells.length - 1; i >= 0; i--) {
          const sh = shells[i];
          sh.vy += 640 * fxDt;
          sh.x += sh.vx * fxDt;
          sh.y += sh.vy * fxDt;
          sh.rot += sh.vRot * fxDt;
          if (sh.y > sh.floorY) {
            sh.y = sh.floorY;
            if (!sh.bounced) {
              sh.bounced = true;
              sh.vy *= -.38;
              sh.vx *= .55;
              sh.vRot *= .5;
            } else {
              sh.vy = 0;
              sh.vx = 0;
              sh.vRot = 0;
            }
          }
          if (sh.bounced) {
            sh.life -= fxDt * .42;
            if (sh.life <= 0) { shells.splice(i, 1); continue; }
          }
          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, sh.life));
          ctx.translate(sh.x, sh.y);
          ctx.rotate(sh.rot);
          ctx.fillStyle = '#c99532';
          ctx.fillRect(-sh.size, -sh.size * .5, sh.size * 2, sh.size);
          ctx.fillStyle = '#f7dc93';
          ctx.fillRect(-sh.size, -sh.size * .5, sh.size * 2, sh.size * .38);
          ctx.restore();
        }
        for (let i = smokePuffs.length - 1; i >= 0; i--) {
          const p = smokePuffs[i];
          p.x += p.vx * fxDt;
          p.y += p.vy * fxDt;
          p.vx *= .98;
          p.vy -= 14 * fxDt;
          p.r += p.grow * fxDt;
          p.life -= fxDt * .85;
          if (p.life <= 0) { smokePuffs.splice(i, 1); continue; }
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life) * .24;
          ctx.fillStyle = '#e9eef5';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Bullet in flight: hot white core with a burning tracer streak.
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.progress = Math.min(1, b.progress + b.speed * fxDt);
          b.x = b.startX + (b.targetX - b.startX) * b.progress;
          b.y = b.startY + (b.targetY - b.startY) * b.progress;
          b.trail.push({ x: b.x, y: b.y });
          if (b.trail.length > 8) b.trail.shift();

          const tail = b.trail[0];
          ctx.save();
          ctx.lineCap = 'round';
          ctx.strokeStyle = 'rgba(255, 214, 120, .16)';
          ctx.lineWidth = 10;
          ctx.beginPath(); ctx.moveTo(tail.x, tail.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          ctx.strokeStyle = 'rgba(255, 232, 170, .62)';
          ctx.lineWidth = 3.6;
          ctx.beginPath(); ctx.moveTo(tail.x, tail.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          ctx.strokeStyle = 'rgba(255, 252, 235, .95)';
          ctx.lineWidth = 1.3;
          ctx.beginPath(); ctx.moveTo(tail.x, tail.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          ctx.fillStyle = 'rgba(255, 196, 92, .5)';
          ctx.beginPath(); ctx.arc(b.x, b.y, 5.6, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fffdf4';
          ctx.beginPath(); ctx.arc(b.x, b.y, 2.7, 0, Math.PI * 2); ctx.fill();
          ctx.restore();

          if (b.progress >= 1 && !b.done) {
            b.done = true;
            const cb = b.onImpact;
            bullets.splice(i, 1);
            cinematicUntil = performance.now() + 240;
            if (typeof cb === 'function') cb(b.targetX, b.targetY);
          }
        }

        // Sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
          const sp = sparks[i];
          sp.x += sp.vx * fxDt;
          sp.y += sp.vy * fxDt;
          sp.vy += 320 * fxDt;
          sp.life -= sp.decay * fxDt;

          if (sp.life <= 0) {
            sparks.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, sp.life);
          ctx.fillStyle = sp.color;
          ctx.fillRect(sp.x - sp.size / 2, sp.y - sp.size / 2, sp.size, sp.size);
          ctx.restore();
        }

        // Win celebration confetti
        for (let i = confetti.length - 1; i >= 0; i--) {
          const c = confetti[i];
          c.x += c.vx * dt;
          c.y += c.vy * dt;
          c.vy += 240 * dt;
          c.vx *= 0.99;
          c.rot += c.vRot * dt;
          c.life -= c.decay * dt;

          if (c.life <= 0) {
            confetti.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, c.life);
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
          ctx.restore();
        }

        const stillAnimating =
          state.phase === 'TUCKING' ||
          state.phase === 'SHOOT' ||
          state.phase === 'ANIMATING' ||
          state.hiderMood !== 'hide' ||
          GUNMAN.alpha > 0.01 ||
          GUNMAN.recoil > 0.01 ||
          GUNMAN.muzzle > 0 ||
          Math.abs(state.targetCoverShift - state.coverShiftProgress) > 0.001 ||
          bullets.length > 0 ||
          shells.length > 0 ||
          smokePuffs.length > 0 ||
          slabs.length > 0 ||
          dustPuffs.length > 0 ||
          sparks.length > 0 ||
          confetti.length > 0 ||
          dustMotes.length > 0;

        if (stillAnimating) {
          animLoopId = requestAnimationFrame(renderFrame);
        } else {
          animLoopId = null;
        }
      }

      function ensureRenderLoop() {
        if (!animLoopId) {
          lastTime = performance.now();
          animLoopId = requestAnimationFrame(renderFrame);
        }
      }

      function getCanvasCoords(clientX, clientY) {
        const rect = els.arenaCanvas.getBoundingClientRect();
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function hitTestBlock(x, y) {
        for (let i = 0; i < blockHitboxes.length; i++) {
          const b = blockHitboxes[i];
          if (x >= b.x - 6 && x <= b.x + b.w + 6 && y >= b.y - 12 && y <= b.groundY + 8) {
            return b.num;
          }
        }
        return null;
      }

      // =========================================================================
      // 5. TOAST HELPER
      // =========================================================================
      function showToast(msg, tone = 'info') {
        const item = document.createElement('div');
        const styles = {
          info: 'bg-amber-50/95 border-amber-700/40 text-slate-900',
          miss: 'bg-rose-50/95 border-rose-500/60 text-rose-950',
          win: 'bg-emerald-50/95 border-emerald-600/60 text-emerald-950'
        };
        item.className = `px-3.5 py-1.5 rounded-xl border text-xs font-bold shadow-lg backdrop-blur-md animate-pop-in ${styles[tone] || styles.info}`;
        item.textContent = msg;
        els.toastContainer.appendChild(item);

        setTimeout(() => {
          item.style.opacity = '0';
          item.style.transform = 'translateY(-6px)';
          item.style.transition = 'opacity 200ms ease, transform 200ms ease';
          setTimeout(() => item.remove(), 220);
        }, 1600);
      }

      // =========================================================================
      // 6. GAME LOOP & ROUND LOGIC
      // =========================================================================
      function getPlayerName(id) {
        return state.players[id]?.name?.trim() || `Player ${id}`;
      }

      function onBlockSelect(blockNum) {
        if (state.phase !== 'HIDE') return;
        audio.playCoverShift();
        state.hiddenBlock = blockNum;
        state.foundCharacter = false;
        state.targetCoverShift = 1;
        state.hoveredBlock = null;
        state.phase = 'TUCKING';
        state.hiderMood = 'hide';
        state.moodT = 0;
        state.aimBlock = null;
        state.crackedBlocks.clear();
        state.shatteredBlocks.clear();
        ensureRenderLoop();
        renderAll();

        // Smooth, unhurried tuck-in into the selected block before pass-the-screen handoff
        setTimeout(() => {
          if (state.phase === 'TUCKING') {
            state.phase = 'HANDOFF';
            renderAll();
          }
        }, 1250);
      }

      function startShooting() {
        if (state.phase !== 'HANDOFF') return;
        audio.playClick();
        audio.playGunCock();
        state.phase = 'SHOOT';
        state.aimBlock = 2;
        GUNMAN.ready = false;
        GUNMAN.alpha = Math.max(GUNMAN.alpha, .35);
        ensureRenderLoop();
        renderAll();
      }

      function onFireBlock(blockNum) {
        if (state.phase !== 'SHOOT' || state.chancesLeft <= 0) return;

        if (state.shatteredBlocks.has(blockNum)) {
          showToast(`Block ${blockNum} broken`, 'miss');
          return;
        }

        state.phase = 'ANIMATING';
        state.chancesLeft -= 1;
        state.aimBlock = blockNum;
        computeBlockHitboxes();

        // Snap the rifle onto the chosen block so the round leaves the real muzzle.
        const aimBox = blockHitboxes[blockNum - 1];
        if (aimBox) {
          GUNMAN.aimX = aimBox.x + aimBox.w * .5;
          GUNMAN.aimY = aimBox.y + aimBox.h * .45;
        }
        updateGunman(1);
        GUNMAN.recoil = 1;
        GUNMAN.muzzle = .09;
        GUNMAN.flashSeed = Math.random() * Math.PI * 2;
        spawnShell();
        spawnMuzzleSmoke();
        renderAll();

        audio.playGunshot();
        setTimeout(() => audio.playGunCycle(), 150);
        setTimeout(() => audio.playShellDrop(), 330);

        const isHit = blockNum === state.hiddenBlock;

        fireTracerToBlock(blockNum, (ix, iy) => {
          const box = blockHitboxes[blockNum - 1];

          if (isHit) {
            audio.playStoneShatter();
            state.shatteredBlocks.add(blockNum);
            state.foundCharacter = true; // Character is found and shown!
            state.hiderMood = 'shock';
            state.moodT = 0;
            if (box) spawnStoneBreakage(box, true);
            const willWinMatch = state.players[state.shooterId].score + 1 >= TARGET_WINS;
            triggerWinCelebration(ix, iy, willWinMatch);
            ensureRenderLoop();

            // He is exposed, freezes, then breaks down crying.
            setTimeout(() => {
              if (state.phase === 'ANIMATING') {
                state.hiderMood = 'cry';
                state.moodT = 0;
                audio.playCry();
                showToast(`CAUGHT! He was behind block ${blockNum}`, 'miss');
              }
            }, 520);
            setTimeout(() => {
              concludeRound({ winnerId: state.shooterId });
            }, 2750);
          } else {
            audio.playStoneCrack();
            setTimeout(() => audio.playRicochet(), 110);
            state.crackedBlocks.add(blockNum);
            if (box) spawnStoneBreakage(box, false);
            ensureRenderLoop();

            if (state.chancesLeft > 0) {
              setTimeout(() => {
                if (state.phase === 'ANIMATING') {
                  showToast(`Miss — block ${blockNum} is empty`, 'miss');
                  state.phase = 'SHOOT';
                  renderAll();
                }
              }, 900);
            } else {
              // Out of shots: he survived the turn. He steps out, then dances.
              state.hiderMood = 'peek';
              state.moodT = 0;
              ensureRenderLoop();
              setTimeout(() => {
                if (state.phase === 'ANIMATING') {
                  state.hiderMood = 'dance';
                  state.moodT = 0;
                  audio.playCheer();
                  const hb = blockHitboxes[state.hiddenBlock - 1];
                  triggerWinCelebration(hb ? hb.x + hb.w / 2 : stageW / 2, stageH * .48, false);
                  showToast(`${getPlayerName(state.hiderId)} was never hit — he survives!`, 'win');
                }
              }, 620);
              setTimeout(() => {
                concludeRound({ winnerId: state.hiderId });
              }, 3150);
            }
          }
        });
      }

      function concludeRound(outcome) {
        state.lastRoundOutcome = outcome;
        state.players[outcome.winnerId].score += 1;

        // The reaction stays on screen under the result card: crying when caught,
        // still dancing when the hider beat the shot.
        state.hiderMood = outcome.winnerId === state.shooterId ? 'cry' : 'dance';
        if (state.hiderMood === 'cry' && state.moodT < .3) state.moodT = .6;

        const isChampion = state.players[outcome.winnerId].score >= TARGET_WINS;
        if (isChampion) {
          state.matchWinnerId = outcome.winnerId;
          triggerWinCelebration(stageW * 0.5, stageH * 0.45, true);
        }

        audio.playWinFanfare();
        state.phase = 'ROUND_END';
        ensureRenderLoop();
        renderAll();
      }

      function nextRound() {
        audio.playClick();
        state.round += 1;
        state.hiderId = state.round % 2 === 1 ? 1 : 2;
        state.shooterId = state.hiderId === 1 ? 2 : 1;

        state.phase = 'HIDE';
        state.hiddenBlock = null;
        state.foundCharacter = false;
        state.hidePeekProgress = 0;
        state.hiderMood = 'hide';
        state.moodT = 0;
        state.aimBlock = null;
        GUNMAN.ready = false;
        GUNMAN.recoil = 0;
        GUNMAN.muzzle = 0;
        shells = [];
        smokePuffs = [];
        state.targetCoverShift = 0;
        state.hoveredBlock = null;
        state.crackedBlocks.clear();
        state.shatteredBlocks.clear();
        state.chancesLeft = MAX_CHANCES;
        state.lastRoundOutcome = null;
        state.matchWinnerId = null;

        ensureRenderLoop();
        renderAll();
      }

      function resetMatch() {
        audio.playClick();
        state.players[1].score = 0;
        state.players[2].score = 0;
        state.round = 0;
        nextRound();
      }

      // =========================================================================
      // 7. UI RENDERING
      // =========================================================================
      function renderAll() {
        const p1Name = getPlayerName(1);
        const p2Name = getPlayerName(2);
        const hiderName = getPlayerName(state.hiderId);
        const shooterName = getPlayerName(state.shooterId);

        els.roundBadge.textContent = `R${state.round}`;
        els.targetWinsDisplay.textContent = String(TARGET_WINS);
        els.p1Score.textContent = String(state.players[1].score);
        els.p2Score.textContent = String(state.players[2].score);

        els.p1RoleTag.textContent = state.hiderId === 1 ? 'HIDE' : 'SHOOT';
        els.p1RoleTag.className = `text-[9px] font-display font-bold uppercase tracking-wider px-1.5 py-0.2 rounded inline-block ${
          state.hiderId === 1 ? 'bg-sky-100 text-sky-900' : 'bg-amber-200 text-amber-950'
        }`;

        els.p2RoleTag.textContent = state.hiderId === 2 ? 'HIDE' : 'SHOOT';
        els.p2RoleTag.className = `text-[9px] font-display font-bold uppercase tracking-wider px-1.5 py-0.2 rounded inline-block ${
